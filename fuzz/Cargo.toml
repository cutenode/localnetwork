[package]
name = "localnetwork-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the root workspace's builds, lints and Cargo.lock never see it: the
# targets need nightly and libFuzzer (the `fuzz-<target>` aliases in .cargo/config.toml).
[workspace]
members = ["."]

[[bin]]
name = "pdb"
path = "fuzz_targets/pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdb_edit"
path = "fuzz_targets/pdb_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anlz"
path = "fuzz_targets/anlz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mysettings"
path = "fuzz_targets/mysettings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracklist"
path = "fuzz_targets/tracklist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mp4"
path = "fuzz_targets/mp4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav"
path = "fuzz_targets/wav.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aup"
path = "fuzz_targets/aup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traktor"
path = "fuzz_targets/traktor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "onelibrary"
path = "fuzz_targets/onelibrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "masterdb"
path = "fuzz_targets/masterdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smartlist"
path = "fuzz_targets/smartlist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rekordbox_sync"
path = "fuzz_targets/rekordbox_sync.rs"
test = false
doc = false
bench = false

[dependencies]
arbitrary = { version = "1.5", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false }
indexmap = "2.14"
libfuzzer-sys = "0.4.13"
locallibrary-core = { version = "0.1.0", path = "../crates/locallibrary", default-features = false, features = ["account"] }
locallibrary-plugin-interop = { version = "0.1.0", path = "../plugins/interop" }
loclib-anlz = { version = "0.1.0", path = "../crates/loclib-anlz" }
loclib-audio = { version = "0.1.0", path = "../crates/loclib-audio" }
loclib-aup = { version = "0.1.0", path = "../crates/loclib-aup" }
loclib-interop = { version = "0.1.0", path = "../crates/loclib-interop", default-features = false, features = ["serato", "traktor"] }
loclib-mixid = { version = "0.1.0", path = "../crates/loclib-mixid" }
loclib-mysettings = { version = "0.1.0", path = "../crates/loclib-mysettings" }
loclib-progress = { version = "0.1.0", path = "../crates/loclib-progress" }
loclib-rekordbox-db = { version = "0.1.0", path = "../crates/loclib-rekordbox-db" }
loclib-tracklist = { version = "0.1.0", path = "../crates/loclib-tracklist" }
rekordbox-pdb = { version = "0.1.0", path = "../vendor/rekordbox-pdb" }
serde_json = "1.0.154"
rusqlite = "0.41"
tempfile = "3"

[[bin]]
name = "keybinds"
path = "fuzz_targets/keybinds.rs"
test = false
doc = false
bench = false
