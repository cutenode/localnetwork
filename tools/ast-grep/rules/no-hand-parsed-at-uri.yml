# The server reads AT URIs through @atproto/syntax: the parsers in apps/web/src/lib/server/atproto/spaces.ts,
# `rkeyOf` there for a record's key, or `AtUri` for a URI already known to be valid. Splitting one on `/`
# takes whatever sits at an index, so a space URI read as a public one (or the reverse) gives the wrong
# DID or key instead of null.
#
# It can't tell a URI by its value, so it flags a split on what is named like one: an `at://` string, a
# string with `at://` replaced away, or a value called `uri`, `space`, `…Uri` or `…Space` (a space is
# always held as its URI here). Tests are left out, and so is client code, to keep @atproto/syntax out
# of the browser bundle.
id: no-hand-parsed-at-uri
language: TypeScript
severity: error
message: This parses an AT URI by hand.
note: Use parseSpaceUri, parseSpaceRecordUri, parsePublicRecordUri or rkeyOf (apps/web/src/lib/server/atproto/spaces.ts), or AtUri from @atproto/syntax.
files:
  - "apps/web/src/lib/server/**"
  - "apps/web/src/routes/**/*.server.ts"
  - "apps/web/src/routes/**/+server.ts"
ignores:
  # Tests take a key or DID from a URI to check the code under test, without going through it.
  - "**/*.test.ts"
rule:
  any:
    - pattern: $URI.split('/')
    - pattern: $URI?.split('/')
constraints:
  URI:
    any:
      - regex: '^(?:.*[.?])?(?:uri|space|[a-zA-Z_$][\w$]*(?:Uri|Space))$'
      - regex: "^['\"`]at://"
      - regex: "\\.replace\\(['\"`]at://"
