# A property test that indexes a list with a drawn number up to a hard-coded bound stops drawing
# whatever is added past it, like a new variant at the end of `Role::ALL`.
id: drawn-index-literal-bound
language: rust
severity: error
message: This index is drawn up to a hard-coded number, so elements past it are never drawn.
note: Draw the element with `gs::sampled_from`, or take the index's bound from the list's `.len()`.
rule:
  pattern: $LIST[$INDEX]
constraints:
  INDEX:
    regex: '\.draw\('
    has:
      stopBy: end
      kind: call_expression
      all:
        - has: { field: function, has: { field: field, regex: "^max_value$" } }
        - has: { field: arguments, has: { kind: integer_literal } }
