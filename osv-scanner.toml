# Advisories osv-scanner (https://google.github.io/osv-scanner/) reports in Cargo.lock and
# pnpm-lock.yaml that don't reach anyone using the tools, or have no fix in range, each with why.
# OpenSSF Scorecard's Vulnerabilities check runs osv-scanner and reads this file; it applies to
# this directory's lockfiles only, so fuzz/osv-scanner.toml covers fuzz/Cargo.lock. A package
# override names one version, so it stops matching once that version changes.

# Shipped with the website, and no zod 3.x release has the fix. pnpm audit skips it too
# (auditConfig in pnpm-workspace.yaml).
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31
reason = "zod 3.x comes in through @atproto/* (^3.23.8), and only 4.6.6 has the fix; the app's own zod 4 is fixed"

# Rust (Cargo.lock)

[[PackageOverrides]]
ecosystem = "crates.io"
name = "atomic-polyfill"
version = "1.0.3"
vulnerability.ignore = true
reason = "unmaintained, no vulnerability; heapless 0.7 (under postcard) only uses it on avr, riscv32, thumbv6m and xtensa targets, and none is built"

# Also ignored in deny.toml, with the same reason.
[[PackageOverrides]]
ecosystem = "crates.io"
name = "crypto-bigint"
version = "0.5.5"
vulnerability.ignore = true
reason = "fixed only in 0.7.6, and k256/p256/p384 0.13 under jacquard 0.12.2 (the latest) need 0.5; the secret it touches is the per-session ES256 DPoP key, and reading it needs timing measurements on this machine"

[[PackageOverrides]]
ecosystem = "crates.io"
name = "paste"
version = "1.0.15"
vulnerability.ignore = true
reason = "unmaintained, no vulnerability; a proc-macro under lofty 0.25.4 (the latest) and netlink-packet-core, so it only runs at compile time"

[[PackageOverrides]]
ecosystem = "crates.io"
name = "quick-xml"
version = "0.37.5"
vulnerability.ignore = true
reason = "only rekordcrate 0.3.0 (the latest, needs ^0.37) uses it, a dev-dependency whose tests only read XML locallibrary wrote; locallibrary itself uses the fixed 0.42"

# Also ignored in deny.toml, with the same reason.
[[PackageOverrides]]
ecosystem = "crates.io"
name = "rsa"
version = "0.9.10"
vulnerability.ignore = true
reason = "no fixed release; jacquard-oauth's jose-jwk pulls it in for JWK types, and sign-in signs with an ES256 DPoP key and never holds an RSA private key"

[[PackageOverrides]]
ecosystem = "crates.io"
name = "zbus_names"
version = "4.3.4"
vulnerability.ignore = true
reason = "unmaintained (merged into zbus 6), no vulnerability; Linux only, through keyring 4.2.0 and secret-service 5.2.0, both the latest and on zbus 5"

[[PackageOverrides]]
ecosystem = "crates.io"
name = "zvariant"
version = "5.15.0"
vulnerability.ignore = true
reason = "unmaintained (merged into zbus 6), no vulnerability; Linux only, through keyring 4.2.0 and secret-service 5.2.0, both the latest and on zbus 5"

[[PackageOverrides]]
ecosystem = "crates.io"
name = "zvariant_derive"
version = "5.15.0"
vulnerability.ignore = true
reason = "unmaintained (merged into zbus 6), no vulnerability; a proc-macro, Linux only, through keyring 4.2.0 and secret-service 5.2.0, both the latest and on zbus 5"

