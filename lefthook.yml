# Git hooks (installed by `pnpm install`). Each TypeScript app has its own jobs, which run in the
# app's folder and only see the files under it; the lexicons have one of their own, and ast-grep
# one over the whole repo.
rc: tools/lefthook-rc.sh
# Every worktree shares one .git/hooks. Without this, the hooks run the lefthook of whichever
# worktree ran `lefthook install` last, and skip their jobs without a word once that worktree is
# gone and neither lefthook nor pnpm is on PATH. `pnpm exec` runs the committing worktree's own
# lefthook (installing it first if that worktree hasn't been), and the hook fails when pnpm isn't
# on PATH, which the jobs need anyway. tools/policy/apps.rego keeps this set.
lefthook: pnpm exec lefthook

# Each hook installs once before its jobs. pnpm checks the dependencies before every `pnpm exec` and `pnpm <script>`
# and installs them when the lockfile has moved on (after a merge), so the parallel jobs would each start an install.
pre-commit:
  parallel: true
  setup:
    - run: pnpm install --frozen-lockfile
  jobs:
    - name: format web
      root: apps/web/
      glob: '*.{ts,js,json,css}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format localtoolbox
      root: apps/localtoolbox/
      glob: '*.{ts,mts,js,json,css,md}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format lexicons
      glob: 'lexicons/computer/**/*.json'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint web
      root: apps/web/
      glob: '*.{ts,js,svelte}'
      run: pnpm exec oxlint {staged_files}
    - name: lint localtoolbox
      root: apps/localtoolbox/
      glob: '*.{ts,mts,js,svelte}'
      run: pnpm exec oxlint {staged_files}
    # The languages sgconfig.yml's rules are written for: TypeScript and Rust, and Svelte, whose
    # scripts the TypeScript rules check.
    - name: ast-grep
      glob: '*.{ts,mts,cts,rs,svelte}'
      run: pnpm exec ast-grep scan {staged_files}

# The jobs run one at a time. Side by side, the web and localtoolbox suites starve each other's
# browser tests of CPU on a busy machine until they time out, and the push fails.
pre-push:
  setup:
    - run: pnpm install --frozen-lockfile
  jobs:
    # One after the other: `svelte-kit sync` and Vite's SvelteKit plugin both rewrite .svelte-kit/types, and svelte-check
    # reading a half-written copy reports that `./$types` is missing.
    - name: typecheck and unit tests web
      root: apps/web/
      run: pnpm check && pnpm test
    - name: typecheck localtoolbox
      root: apps/localtoolbox/
      run: pnpm check
    - name: tests localtoolbox
      root: apps/localtoolbox/
      run: pnpm test
    # Nothing else here compiles what's behind cfg(windows), so a slip there would wait for CI's Windows job. Skipped
    # without the target and a MinGW compiler, which the crates that build C need: `rustup target add
    # x86_64-pc-windows-gnu`, `brew install mingw-w64`.
    - name: clippy for Windows
      glob:
        - '*.rs'
        - '*.toml'
        - Cargo.lock
      skip:
        - run: '! (command -v x86_64-w64-mingw32-gcc && rustup target list --installed | grep -q x86_64-pc-windows-gnu) > /dev/null'
      run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
