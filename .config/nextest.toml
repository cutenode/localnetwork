# The CLI properties that run the binary hundreds of times take minutes each: started first, they
# run beside the rest instead of after it, so they don't set the length of the run.
[[profile.default.overrides]]
filter = 'test(/^props_cli_(changes|human)::/)'
priority = 100

# The plugin protocol's tests talk over pipes: a broken peer would leave one waiting forever for a
# message, so it fails after a minute instead.
[[profile.default.overrides]]
filter = 'package(loclib-plugin)'
slow-timeout = { period = "30s", terminate-after = 2 }

# A plugin test waits on a plugin process: one that never answers fails after two minutes instead
# of holding the job until its timeout.
[[profile.default.overrides]]
filter = 'test(/(^|::)plugins?(::|_|$)/)'
slow-timeout = { period = "60s", terminate-after = 2 }

# The plugin tests (the protocol, the host, the first-party plugins and what shows them): CI runs
# them in a job of their own (`--profile plugins`) and the rest with `--profile core`. The default
# profile runs both.
[profile.core]
default-filter = 'not (package(/^(loclib-plugin|locallibrary-plugin-.+)$/) | test(/(^|::)plugins?(::|_|$)/))'

[profile.plugins]
default-filter = 'package(/^(loclib-plugin|locallibrary-plugin-.+)$/) | test(/(^|::)plugins?(::|_|$)/)'
