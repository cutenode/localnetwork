[package]
name = "locallibrary"
description = "Store, sync, compare, merge and configure rekordbox USB library exports"
# Not on crates.io: it's built on the vendored rekordbox-pdb, which isn't published either, it's to
# be renamed `locallibrary-core` first (TODO.md), and it carries the test plugin below. The
# loclib-* crates are its parts that can be.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The plugin the plugin host's tests start (`tests/it/plugins.rs`). As a binary, cargo builds it
# with them and hands them its path (`CARGO_BIN_EXE_test-plugin`), and nextest's archives carry it.
[[bin]]
name = "test-plugin"
path = "src/bin/test-plugin/main.rs"
test = false
doc = false

[features]
default = ["account", "peers"]
# The Atmosphere account (AT Protocol OAuth sign-in) and publishing to it: the `atmosphere` and
# `publish` modules and the `account_*` and `*_publish_*` API. Its async runtime, AT Protocol
# clients and DNS are for this alone (the HTTP client and the keychain are plugins' too).
account = [
    "dep:hickory-resolver",
    "dep:http",
    "dep:jacquard-api",
    "dep:jacquard-common",
    "dep:jacquard-identity",
    "dep:jacquard-oauth",
    "dep:tokio",
    "dep:unicode-segmentation",
]
# Fetching snapshots from another computer's store (`store serve`, `store fetch`): iroh's
# encrypted QUIC connections, which reach the other computer through n0's relays when they can't
# connect directly, or stay on the local network.
peers = ["dep:iroh", "dep:iroh-tickets", "dep:tokio"]

[dependencies]
rekordbox-pdb.workspace = true
aes.workspace = true
blake3.workspace = true
cbc.workspace = true
chrono.workspace = true
directories.workspace = true
filetime.workspace = true
fs4.workspace = true
getrandom.workspace = true
hmac.workspace = true
image.workspace = true
http = { workspace = true, optional = true }
jacquard-api = { workspace = true, optional = true }
jacquard-common = { workspace = true, optional = true }
jacquard-identity = { workspace = true, optional = true }
jacquard-oauth = { workspace = true, optional = true }
# The keychain, for the account's session and plugins' secrets.
keyring.workspace = true
# The keychain entries themselves, from whichever store is the default: the system's, which
# `keyring` sets, or the tests' in-memory one.
keyring-core = { version = "1" }
# `blocking`: plugins' `net/fetch`, answered on the callback's own thread.
reqwest = { workspace = true, features = ["blocking"] }
lofty.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
rustfft.workspace = true
same-file.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
symphonia.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["macros", "sync"] }
uuid.workspace = true
walkdir.workspace = true
rustc-hash.workspace = true
indexmap.workspace = true
loclib-equipment = { workspace = true, features = ["schemars"] }
loclib-mysettings = { workspace = true, features = ["schemars"] }
loclib-progress = { workspace = true, features = ["schemars"] }
loclib-model = { workspace = true, features = ["schemars"] }
loclib-tracklist = { workspace = true, features = ["schemars"] }
loclib-mixid.workspace = true
base64.workspace = true
loclib-analysis = { workspace = true, features = ["schemars"] }
loclib-transcode = { workspace = true, features = ["schemars"] }
iroh = { version = "1.3", optional = true }
iroh-tickets = { version = "1", optional = true }
quick-xml = "0.42"
ring = "0.17.14"
unicode-segmentation = { version = "1.13.3", optional = true }
# The plugin protocol the plugin host speaks (`plugin`).
loclib-plugin.workspace = true
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"], optional = true }
# How a URL's query spells a plugin's secret, to leave that out of what the plugin is told too.
form_urlencoded = "1.2.2"
oauth2 = { version = "5.0.0", default-features = false }

[dev-dependencies]
hegeltest = { workspace = true, features = ["chrono"] }
# Independent parser used to cross-check what locallibrary writes.
rekordcrate.workspace = true
binrw = "0.14"
quick-xml = { version = "0.42", features = ["serialize"] }
# Independent FAT reader used to check the FAT32 formatter.
fatfs = "0.3"
loclib-model = { workspace = true, features = ["test-util"] }
loclib-mixid = { workspace = true, features = ["test-util"] }
jsonschema.workspace = true
# The interop plugin's rekordbox XML writer, which tests read fixture drives' libraries through.
loclib-interop.workspace = true
# The demos plugin, served in the tests that apply its plans to drives (`props_demos`).
locallibrary-plugin-demos = { path = "../../plugins/demos" }

[target."cfg(windows)".dependencies]
# A file's index and its volume's serial number, which the drive watcher tells rewrites by.
winapi-util = "0.1.11"
# Whether this process is elevated: plugins are never started from one. And sparse files for
# tests (`testing::sparse`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
# Whether this process runs as root: plugins are never started from one.
libc = "0.2"

[lints]
workspace = true
