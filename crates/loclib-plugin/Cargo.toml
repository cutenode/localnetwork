[package]
name = "loclib-plugin"
description = "The locallibrary plugin protocol (JSON-RPC over stdio), its manifest and an SDK for writing plugins in Rust"
readme = "README.md"
keywords = ["dj", "plugin", "json-rpc", "rekordbox"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
httpdate = "1.0.3"
indexmap.workspace = true
jsonschema.workspace = true
loclib-model = { workspace = true, features = ["schemars"] }
loclib-progress = { workspace = true, features = ["schemars"] }
rustc-hash.workspace = true
schemars = { version = "1.2", default-features = false, features = ["derive", "std", "indexmap2"] }
semver = "1.0.28"
serde.workspace = true
serde_ignored = "0.1.14"
serde_json.workspace = true
serde_path_to_error.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
# `preserve_order`: an analyzer's fields (columns) keep the order its manifest gives them.
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
url = "2.5"

[features]
# `test_util`: a fake host to test a plugin against over the protocol, and its cancel of the
# request it's serving.
test-util = ["dep:tempfile"]

[dev-dependencies]
criterion.workspace = true
hegeltest.workspace = true
jacquard-common.workspace = true
loclib-model = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "protocol"
harness = false
