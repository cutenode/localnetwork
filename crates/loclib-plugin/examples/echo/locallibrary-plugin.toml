id = "echo"
name = "Echo"
version = "0.1.0"
protocol = "^0.2"
capabilities = ["library:read", "library:plan"]

[[contributes.commands]]
name = "echo"
title = "Answer the params"
mode = "headless"
params = { type = "object" }

[[contributes.commands]]
name = "titles"
title = "List the drive's tracks"
mode = "view"

[[contributes.commands]]
name = "steps"
title = "Report progress in steps"
mode = "headless"

[[contributes.commands]]
name = "wait"
title = "Wait until cancelled"
mode = "headless"

[[contributes.operations]]
name = "playlist"
title = "Make a playlist"
where = ["track", "playlist", "drive"]
params = { type = "object", properties = { name = { type = "string" } }, required = ["name"] }

[[contributes.panels]]
name = "about"
title = "About the track"

[[contributes.analyzers]]
name = "size"
title = "File size"
version = "1"
fields = { bytes = "integer" }

[[contributes.exporters]]
format = "m3u"
title = "M3U playlist"
extension = "m3u"

[[contributes.providers]]
name = "tags"
title = "The tags as they are"
kind = "metadata"

[[contributes.themes]]
name = "night"
title = "Night"
tokens = { ui = { accent = "#ff8800" }, cues = { hot = "#00e5ff" }, waveform = { spectrum = ["#102040", "#ff8800"] } }

[[contributes.settings]]
key = "greeting"
title = "Greeting"
type = "string"
default = "hello"
