[package]
name = "loclib-waveform"
description = "ratatui widgets for music software: rekordbox-style waveforms, cue markers, phrases, a spectrum, a scope and cover art"
readme = "README.md"
keywords = ["ratatui", "tui", "waveform", "dj", "rekordbox"]
categories = ["command-line-interface", "multimedia::audio", "visualization"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.localnetwork]
labels = ["locallibrary: player"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
loclib-model.workspace = true
image = { workspace = true, optional = true }
ratatui = { version = "0.30", default-features = false, features = ["std"] }
rustfft = { workspace = true, optional = true }

[features]
# `Art`: decoding cover art (JPEG, PNG, WebP, BMP, GIF) and resampling it to cells.
image = ["dep:image"]
# `analyzer`: turning the samples being played into a spectrum's bands and a scope's trace (an FFT).
analyzer = ["dep:rustfft"]

[dev-dependencies]
criterion.workspace = true
hegeltest.workspace = true
image.workspace = true

[lints]
workspace = true

[[bench]]
name = "widgets"
harness = false
