[package]
name = "locallibrary-cli"
description = "Command line interface for locallibrary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "locallibrary"
path = "src/main.rs"
# The binary shares its name with the library crate, so their rustdoc output would collide
# (cargo#6313). The library is the documented API.
doc = false

# Release packaging (see dist-workspace.toml): name the Homebrew formula after the command.
[package.metadata.dist]
formula = "locallibrary"

[features]
default = ["account", "tui", "playback"]
# The Atmosphere account: `account`, publishing (`profile publish`, `plays publish`, `settings
# publish`, `settings import --from-handle`), the `account.*` and `*.publish.*` RPC methods and
# signing in from the player's Profile view. Most of the dependencies (an HTTP client, an async
# runtime, TLS, the keychain) are for this alone.
account = ["locallibrary/account"]
# The interactive player (`locallibrary tui`, and `locallibrary` on its own in a terminal).
tui = ["dep:image", "dep:ratatui", "dep:rodio", "dep:rustfft"]
# The player's audio output: cpal, and ALSA on Linux. Without it the player browses, edits and
# shows waveforms, but there's no output to play through.
playback = ["tui", "rodio/playback"]

[dependencies]
locallibrary.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
console.workspace = true
# `termination`: SIGTERM (a GUI stopping the process) stops at a safe point too, as Ctrl-C does.
ctrlc = { version = "3.5", features = ["termination"] }
image = { workspace = true, optional = true }
indicatif.workspace = true
ratatui = { version = "0.30", optional = true }
# Playback for the TUI: rekordbox drives carry MP3, AAC/ALAC (.m4a), FLAC, WAV and AIFF. The
# output device comes with the `playback` feature.
rodio = { version = "0.22", optional = true, default-features = false, features = [
    "symphonia-aac",
    "symphonia-aiff",
    "symphonia-alac",
    "symphonia-flac",
    "symphonia-isomp4",
    "symphonia-mp3",
    "symphonia-pcm",
    "symphonia-wav",
] }
rustfft = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# Columns a typed character takes (ratatui already depends on it).
unicode-width = "0.2"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# Sending a long listing through a pager (dup2), and SIGPIPE for output piped into `head`.
libc = "0.2"
# SIGTERM for the RPC sidecar; the TUI also lets a drive write finish and saves its state when the
# terminal closes (SIGHUP) or it's told to stop (SIGTERM). Already built for crossterm.
signal-hook = "0.3"

[dev-dependencies]
tempfile.workspace = true
hegeltest.workspace = true
assert_cmd = "2"
rekordbox-pdb.workspace = true
image.workspace = true
