[package]
name = "loclib-analysis"
description = "A second opinion on DJ tracks' tempo and key, loudness and clipping, three-band waveforms, and benchmark scoring against annotated datasets"
readme = "README.md"
keywords = ["dj", "bpm", "key-detection", "loudness", "audio"]
categories = ["multimedia::audio"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
biquad = { version = "0.6.0", optional = true }
ebur128 = { version = "0.1", optional = true }
indexmap.workspace = true
loclib-audio.workspace = true
loclib-mixid.workspace = true
loclib-model.workspace = true
loclib-progress.workspace = true
schemars = { version = "1.2", default-features = false, features = ["derive", "indexmap2", "std"], optional = true }
serde.workspace = true
stratum-dsp = { version = "1", optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
hegeltest.workspace = true
loclib-model = { workspace = true, features = ["test-util"] }
loclib-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = ["dsp"]
# `analyze`: decoding a track and measuring its tempo and key (stratum-dsp), loudness (ebur128)
# and waveform (biquad). Without it, only `benchmark` and `tempo`, which score and compare what an
# analyzer found.
dsp = ["dep:biquad", "dep:ebur128", "dep:stratum-dsp"]
schemars = ["dep:schemars"]

[lints]
workspace = true

[[test]]
name = "props"
required-features = ["dsp"]

[[bench]]
name = "analyze"
harness = false
required-features = ["dsp"]
