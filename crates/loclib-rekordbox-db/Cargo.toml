[package]
name = "loclib-rekordbox-db"
description = "Read and edit rekordbox's SQLite databases: the OneLibrary database (exportLibrary.db) on a USB drive"
readme = "README.md"
keywords = ["rekordbox", "onelibrary", "sqlcipher", "dj", "pioneer"]
categories = ["database", "multimedia::audio", "parser-implementations"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.localnetwork]
labels = ["locallibrary: core"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
blake3.workspace = true
chrono.workspace = true
getrandom.workspace = true
loclib-model.workspace = true
loclib-sqlcipher = { workspace = true, features = ["rusqlite"] }
rusqlite.workspace = true
rustc-hash.workspace = true
schemars = { version = "1.2", default-features = false, features = ["derive", "std"], optional = true }
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[features]
# `JsonSchema` for the types that describe what an edit did.
schemars = ["dep:schemars"]
# `test_util`: databases built for tests, in this crate and the ones built on it.
test-util = []

[dev-dependencies]
hegeltest.workspace = true
loclib-model = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
