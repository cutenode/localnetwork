# cargo-about (https://github.com/EmbarkStudios/cargo-about) writes the licences of what the
# locallibrary binary is built from into THIRD-PARTY-NOTICES.md, with about.hbs: run
# `cargo notices` (.cargo/config.toml). locallibrary-release.yml runs it before dist builds the
# archives, which include the file (dist-workspace.toml).

# deny.toml's [licenses] allow, which tools/policy/release.rego keeps in step with this. For a
# crate under a choice of licences, the first one here that it offers is the one listed, so the
# short permissive ones come first.
accepted = [
    "MIT",
    "MIT-0",
    "0BSD",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# The platforms release builds are made for (dist-workspace.toml).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# What ships, not what the tests use.
ignore-dev-dependencies = true
