# Every app and package with a package.json (pnpm skips folders without one).
packages:
  - apps/*
  - packages/*
linkWorkspacePackages: false
engineStrict: true
allowBuilds:
  better-sqlite3: true
  protobufjs: false
  sharp: true
  core-js: false
  esbuild: true
  lefthook: true
  '@ast-grep/cli': true
# Atproto Spaces alpha: pin every @atproto package to the same alpha build.
overrides:
  '@atproto/api': 0.0.0-spaces-alpha-20261105160032
  '@atproto/aws': 0.0.0-spaces-alpha-20261105160032
  '@atproto/bsky': 0.0.0-spaces-alpha-20261105160032
  '@atproto/bsync': 0.0.0-spaces-alpha-20261105160032
  '@atproto/car': 0.0.0-spaces-alpha-20261105160032
  '@atproto/common': 0.0.0-spaces-alpha-20261105160032
  '@atproto/common-web': 0.0.0-spaces-alpha-20261105160032
  '@atproto/crypto': 0.0.0-spaces-alpha-20261105160032
  '@atproto/dev-env': 0.0.0-spaces-alpha-20261105160032
  '@atproto/did': 0.0.0-spaces-alpha-20261105160032
  '@atproto/identity': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-builder': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-cbor': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-client': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-data': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-document': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-installer': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-json': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-password-session': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-resolver': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lex-schema': 0.0.0-spaces-alpha-20261105160032
  '@atproto/lexicon': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-client': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-client-node': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-provider': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-provider-api': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-provider-ui': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-scopes': 0.0.0-spaces-alpha-20261105160032
  '@atproto/oauth-types': 0.0.0-spaces-alpha-20261105160032
  '@atproto/ozone': 0.0.0-spaces-alpha-20261105160032
  '@atproto/pds': 0.0.0-spaces-alpha-20261105160032
  '@atproto/repo': 0.0.0-spaces-alpha-20261105160032
  '@atproto/space': 0.0.0-spaces-alpha-20261105160032
  '@atproto/star': 0.0.0-spaces-alpha-20261105160032
  '@atproto/sync': 0.0.0-spaces-alpha-20261105160032
  '@atproto/syntax': 0.0.0-spaces-alpha-20261105160032
  '@atproto/xrpc': 0.0.0-spaces-alpha-20261105160032
  '@atproto/xrpc-server': 0.0.0-spaces-alpha-20261105160032
  # Dev-only paths whose own ranges keep a version with known advisories.
  # connect-node 1.7.0 (atproto dev network) only takes Headers from undici, and only on Node < 18.
  '@connectrpc/connect-node>undici': ^6.29.1
  # typed-rest-client 2.3.1 (Stryker's dashboard reporter and init) pins qs 6.15.1, and only calls
  # qs.stringify.
  'typed-rest-client>qs': ^6.16.1
  # sdk-node 0.219.0 (atproto dev network) pins propagator-jaeger 2.8.0; 2.9.0 has the fix.
  '@opentelemetry/sdk-node>@opentelemetry/propagator-jaeger': 2.9.0
  # Every get-uri release (Lighthouse CI's proxy-agent, through pac-proxy-agent) takes basic-ftp
  # ^5, which has GHSA-c475-qrg2-pj4r. get-uri only reads ftp: URLs, with new Client(), access,
  # lastMod, list (each entry's name and modifiedAt), downloadTo and close, all the same in 6.
  # 6.0.0's one breaking change refuses a PASV reply that names another host than the one
  # connected to, which a PAC file fetched over FTP would only hit on an unusual server.
  'get-uri>basic-ftp': ^6.2.6
  # Every satori release pins fflate 0.7.3, which has GHSA-px8p-9vwx-vf98 (an endless loop on a
  # malformed ZIP64 archive); 0.7.5 fixes it. Satori only calls inflateSync, to read fonts.
  'satori>fflate': ^0.7.5
patchedDependencies:
  # SvelteKit's client imports the root error page before it hydrates, but the server doesn't
  # preload it, so every page fetched it a round trip late (sveltejs/kit#17415). That round trip put
  # /projects/halflight's simulated LCP over Lighthouse's budget on a busy machine. Drop the patch
  # once a release has the fix (sveltejs/kit#17416).
  '@sveltejs/kit@3.1.0': patches/@sveltejs__kit@3.1.0.patch
# zod 3.x reaches prod only through @atproto/* (^3.23.8), and no 3.x release has the fix (4.6.6
# does). Drop this once @atproto moves to zod 4.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
