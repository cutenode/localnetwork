# Disable exotic subdeps in older pnpm versions.
blockExoticSubdeps: true
# Fail if trusted publishing or provenance is gone from a package that used to have it.
trustPolicy: no-downgrade
# Versions whose own maintainers published them by hand after earlier releases had provenance.
# Each is pinned, so the next release is checked again. chokidar 4.0.2 on (paulmillr; 4.0.1 had
# provenance, 5.x has trusted publishing, svelte-check takes ^4). lefthook 2.2.2 (mrexox; 2.2.1 came
# from GitHub Actions). chromium-bidi, which puppeteer-core pins exactly (chrome-devtools-npm; the
# last release with provenance was 17.0.2). @yarnpkg/libzip 3.2.2, which @lavamoat/harden's
# @yarnpkg/core takes at ^3.2.2 (arcanis; 3.2.0 and 3.2.1 came from yarnbot with provenance).
trustPolicyExclude:
  - '@yarnpkg/libzip@3.2.2'
  - chokidar@4.0.3
  - chromium-bidi@157.0.8090-0
  - lefthook@2.2.2
