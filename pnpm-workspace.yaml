# Every app and package with a package.json (pnpm skips folders without one).
packages:
  - apps/*
  - packages/*
linkWorkspacePackages: false
engineStrict: true
allowBuilds:
  better-sqlite3: true
  protobufjs: false
  sharp: true
  core-js: false
  esbuild: true
  lefthook: true
  '@ast-grep/cli': true
# Atproto Spaces alpha: pin every @atproto package to the same alpha build.
overrides:
  '@atproto/api': 0.0.0-spaces-alpha-20261022141228
  '@atproto/aws': 0.0.0-spaces-alpha-20261022141228
  '@atproto/bsky': 0.0.0-spaces-alpha-20261022141228
  '@atproto/bsync': 0.0.0-spaces-alpha-20261022141228
  '@atproto/car': 0.0.0-spaces-alpha-20261022141228
  '@atproto/common': 0.0.0-spaces-alpha-20261022141228
  '@atproto/common-web': 0.0.0-spaces-alpha-20261022141228
  '@atproto/crypto': 0.0.0-spaces-alpha-20261022141228
  '@atproto/dev-env': 0.0.0-spaces-alpha-20261022141228
  '@atproto/did': 0.0.0-spaces-alpha-20261022141228
  '@atproto/identity': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-builder': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-cbor': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-client': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-data': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-document': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-installer': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-json': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-password-session': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-resolver': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lex-schema': 0.0.0-spaces-alpha-20261022141228
  '@atproto/lexicon': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-client': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-client-node': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-provider': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-provider-api': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-provider-ui': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-scopes': 0.0.0-spaces-alpha-20261022141228
  '@atproto/oauth-types': 0.0.0-spaces-alpha-20261022141228
  '@atproto/ozone': 0.0.0-spaces-alpha-20261022141228
  '@atproto/pds': 0.0.0-spaces-alpha-20261022141228
  '@atproto/repo': 0.0.0-spaces-alpha-20261022141228
  '@atproto/space': 0.0.0-spaces-alpha-20261022141228
  '@atproto/sync': 0.0.0-spaces-alpha-20261022141228
  '@atproto/syntax': 0.0.0-spaces-alpha-20261022141228
  '@atproto/xrpc': 0.0.0-spaces-alpha-20261022141228
  '@atproto/xrpc-server': 0.0.0-spaces-alpha-20261022141228
  # Dev-only paths whose own ranges keep a version with known advisories.
  # connect-node 1.7.0 (atproto dev network) only takes Headers from undici, and only on Node < 18.
  '@connectrpc/connect-node>undici': ^6.29.1
  # typed-rest-client 2.3.1 (Stryker's dashboard reporter and init) pins qs 6.15.1, and only calls
  # qs.stringify.
  'typed-rest-client>qs': ^6.16.1
  # sdk-node 0.219.0 (atproto dev network) pins propagator-jaeger 2.8.0; 2.9.0 has the fix.
  '@opentelemetry/sdk-node>@opentelemetry/propagator-jaeger': 2.9.0
  # @lhci/cli and the external-editor under it (through inquirer) only call tmp.fileSync and
  # tmp.tmpNameSync, which 0.2 keeps.
  '@lhci/cli>tmp': ^0.2.6
  'external-editor>tmp': ^0.2.6
# Stryker's vitest runner 10.0.0 names tests the way Vitest 4 did, so on Vitest 5 it runs no tests
# for a mutant and every mutant survives (stryker-mutator/stryker-js#6210). Drop the patch once a
# release has the fix (#6214).
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
  # SvelteKit's client imports the root error page before it hydrates, but the server doesn't
  # preload it, so every page fetched it a round trip late (sveltejs/kit#17415). That round trip put
  # /projects/halflight's simulated LCP over Lighthouse's budget on a busy machine. Drop the patch
  # once a release has the fix (sveltejs/kit#17416).
  '@sveltejs/kit@3.1.0': patches/@sveltejs__kit@3.1.0.patch
# zod 3.x reaches prod only through @atproto/* (^3.23.8), and no 3.x release has the fix (4.6.6
# does). Drop this once @atproto moves to zod 4.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
