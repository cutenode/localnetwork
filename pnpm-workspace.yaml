# Every app and package with a package.json (pnpm skips folders without one).
packages:
  - apps/*
  - packages/*
linkWorkspacePackages: false
engineStrict: true
# Install scripts run only for these versions, so a bump has to approve its script again.
# better-sqlite3 fetches or builds the native addon @atproto/pds (the dev network) loads, lefthook
# installs the git hooks, and ast-grep links its platform package's binary in place of a JS shim
# that warns on every run. The others work without theirs: esbuild runs its platform package's
# binary, sharp uses its prebuilt @img package, and core-js and protobufjs only print.
allowBuilds:
  '@ast-grep/cli@0.51.0': true
  better-sqlite3@12.11.1: true
  lefthook@2.2.2: true
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
# Atproto Spaces alpha: pin the @atproto packages that have a build of it to one alpha build.
overrides:
