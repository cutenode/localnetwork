# `cargo coverage`: the tests under cargo-llvm-cov, failing below these thresholds. CI runs it on
# Linux; raise the thresholds to just under its numbers when coverage goes up. Only
# the code that ships is measured: test modules live in files of their own (`tests.rs`, and the
# TUI's `props.rs`, `screens.rs` and `testing.rs`), left out with `test_util.rs` and the test
# plugin (`bin/test-plugin/`, which the CLI's debug builds include too) by the regex, which takes
# either separator: on Windows the report names files with backslashes.
# tools/hegel-coverage.sh runs this too, for the Hegel tests alone. Tests that kill a child process
# can catch it writing its profile as it exits; `--failure-mode all` merges the rest instead of
# failing, and coverage lost that way still counts against the thresholds. It takes no build
# flags (the root manifest is a virtual workspace, so it covers every member) because CI also runs
# it against a nextest archive, which refuses them.
[alias]
coverage = "llvm-cov nextest --no-fail-fast --failure-mode all --fail-under-lines 95.2 --fail-under-functions 93.9 --fail-under-regions 93.3 --ignore-filename-regex (^|[/\\\\])((tests|testing|test_util|screens|props)\\.rs$|test-plugin[/\\\\])"
# `cargo +nightly fuzz-<target>`: one fuzz target (fuzz/) until it finds a crash or you stop it,
# with libFuzzer options after it (`cargo +nightly fuzz-anlz -max_total_time=300`), from the
# repository root. libFuzzer keeps what reaches new code in the first folder, fuzz/corpus/<target>/
# (ignored by git, cached by CI, made by -create_missing_dirs), and only reads the seeds after it:
# the tests' fixtures, and fuzz/seeds/ for formats whose tests keep their examples inline.
fuzz-pdb = ["fuzz", "run", "pdb", "fuzz/corpus/pdb", "crates/locallibrary/tests/fixtures/rekordcrate/demo_tracks/PIONEER/rekordbox", "crates/locallibrary/tests/fixtures/rekordcrate/empty/PIONEER/rekordbox", "--", "-create_missing_dirs=1"]
fuzz-pdb_edit = ["fuzz", "run", "pdb_edit", "fuzz/corpus/pdb_edit", "--", "-create_missing_dirs=1"]
fuzz-anlz = ["fuzz", "run", "anlz", "fuzz/corpus/anlz", "crates/locallibrary/tests/fixtures/rekordcrate/demo_tracks/PIONEER/USBANLZ", "--", "-create_missing_dirs=1"]
fuzz-mysettings = ["fuzz", "run", "mysettings", "fuzz/corpus/mysettings", "crates/locallibrary/tests/fixtures/rekordcrate/settings", "--", "-create_missing_dirs=1"]
fuzz-tracklist = ["fuzz", "run", "tracklist", "fuzz/corpus/tracklist", "fuzz/seeds/tracklist", "--", "-create_missing_dirs=1"]
