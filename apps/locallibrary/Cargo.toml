[package]
name = "locallibrary-cli"
description = "Command line interface for locallibrary"
# Released with dist (archives, installers, Homebrew), not to crates.io: the locallibrary crate,
# the plugins and the vendored rekordbox-pdb it's built from aren't published.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "locallibrary"
path = "src/main.rs"
# The binary shares its name with the library crate, so their rustdoc output would collide
# (cargo#6313). The library is the documented API.
doc = false

# Release packaging (see dist-workspace.toml): name the Homebrew formula after the command.
# `dist = true` because dist leaves out a package with `publish = false` unless told otherwise.
[package.metadata.dist]
dist = true
formula = "locallibrary"

[features]
default = ["account", "tui", "playback", "peers"]
# The Atmosphere account: `account`, publishing (`profile publish`, `sets publish`, `settings
# publish`, `settings import --from-handle`), posting bug reports (`bug`; without it, `bug` opens
# GitHub's form), the `account.*` and `*.publish.*` RPC methods and signing in from the player's
# Profile view. Most of the dependencies (an HTTP client, an async
# runtime, TLS, the keychain) are for this alone.
account = ["locallibrary/account"]
# `store serve` and `store fetch`: copying snapshots between computers over the network.
peers = ["locallibrary/peers"]
# The interactive player (`locallibrary tui`, and `locallibrary` on its own in a terminal).
tui = ["dep:ratatui", "dep:rodio", "dep:rustfft", "dep:loclib-waveform"]
# The player's audio output: cpal, and ALSA on Linux. Without it the player browses, edits and
# shows waveforms, but there's no output to play through.
playback = ["tui", "rodio/playback"]

[dependencies]
locallibrary.workspace = true
anyhow.workspace = true
chrono.workspace = true
# `string`: the commands, flags and formats plugins add are named at run time.
clap = { workspace = true, features = ["string"] }
clap_complete.workspace = true
clap_mangen.workspace = true
console.workspace = true
# `termination`: SIGTERM (a GUI stopping the process) stops at a safe point too, as Ctrl-C does.
ctrlc = { version = "3.5", features = ["termination"] }
indicatif.workspace = true
ratatui = { version = "0.30", optional = true }
# The player's waveforms, visualisers and cover art.
loclib-waveform = { workspace = true, optional = true, features = ["image"] }
# Playback for the TUI: rekordbox drives carry MP3, AAC/ALAC (.m4a), FLAC, WAV and AIFF. The
# output device comes with the `playback` feature.
rodio = { version = "0.22", optional = true, default-features = false, features = [
    "symphonia-aac",
    "symphonia-aiff",
    "symphonia-alac",
    "symphonia-flac",
    "symphonia-isomp4",
    "symphonia-mp3",
    "symphonia-pcm",
    "symphonia-wav",
] }
rustfft = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# Columns a typed character takes (ratatui already depends on it).
unicode-width = "0.2"
uuid.workspace = true
rustc-hash.workspace = true
indexmap.workspace = true
# The RPC sidecar's framing, error codes and invalid_params errors, shared with the plugin protocol.
loclib-plugin.workspace = true
# The test plugin the CLI's tests register (`LOCALLIBRARY_TEST_PLUGINS`) reports progress with it.
loclib-progress.workspace = true
# The plugins locallibrary ships (`plugins::FIRST_PARTY`), each served by `plugin serve <id>`: one
# for every folder in plugins/, which build.rs checks.
locallibrary-plugin-sound = { version = "0.1.0", path = "../../plugins/sound" }
locallibrary-plugin-coverart = { version = "0.1.0", path = "../../plugins/coverart" }
locallibrary-plugin-tracklist = { version = "0.1.0", path = "../../plugins/tracklist" }
locallibrary-plugin-interop = { version = "0.1.0", path = "../../plugins/interop" }
locallibrary-plugin-demos = { version = "0.1.0", path = "../../plugins/demos" }
locallibrary-plugin-musicbrainz = { version = "0.1.0", path = "../../plugins/musicbrainz" }
os_info = { version = "3.15.0", default-features = false }
percent-encoding.workspace = true
base64.workspace = true
# Splits each `refresh --then` into words the way a shell does (the hints' tests check their
# quoting with it too).
shlex = "2.0.1"
locallibrary-plugin-soundcloud = { version = "0.1.0", path = "../../plugins/soundcloud" }

[target.'cfg(unix)'.dependencies]
# Sending a long listing through a pager (dup2), and SIGPIPE for output piped into `head`.
libc = "0.2"
# SIGTERM for the RPC sidecar; the TUI also lets a drive write finish and saves its state when the
# terminal closes (SIGHUP) or it's told to stop (SIGTERM). Already built for crossterm.
signal-hook = "0.3"

[dev-dependencies]
tempfile.workspace = true
hegeltest.workspace = true
assert_cmd = "2"
rekordbox-pdb.workspace = true
image.workspace = true
# Builds rekordbox-shaped collection databases (`master.db`) for `collection`'s tests.
rusqlite.workspace = true
loclib-mixid = { workspace = true, features = ["test-util"] }
# Checks the RPC sidecar's answers against its contract (docs/rpc/schema.json).
jsonschema.workspace = true
# For the library's test helpers the CLI's tests share (crates/locallibrary/tests/support): copying
# drives with their files' modification times, and signing in as jacquard does.
walkdir.workspace = true
filetime.workspace = true
jacquard-oauth.workspace = true
tokio.workspace = true
loclib-model = { workspace = true, features = ["test-util"] }
# Writes the Traktor collections the interop plugin's library source is tested on.
loclib-interop.workspace = true

[lints]
workspace = true

[build-dependencies]
# Reads this manifest's dependencies, to check there's one for every plugin (build.rs).
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
