# A pull request a month for each ecosystem, every update in one.
#
# The workflows pin actions to commits; this keeps the pins current. release.yml's pins are
# also listed in dist-workspace.toml ([dist.github-action-commits]): update them there too.
#
# Cargo: Cargo.lock only, the semver-compatible updates `cargo update` would make. Cargo.toml
# (and its `=` pins) is changed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      cargo:
        patterns: ["*"]
