name: Scheduled

# The slow suites, weekly and on demand (Actions > Scheduled > Run workflow, on any branch),
# so pull requests only wait for ci.yml's quick checks. Also a weekly RustSec check, which
# catches advisories published against Cargo.lock between pushes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Pinned the same way as ci.yml.
jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories

  # The builds without the default features (`account`, `tui`, `playback`): a headless sidecar
  # with and without the account. No ALSA headers until the last step, which shows the builds
  # without `playback` don't need them; then clippy over every combination of features.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest,cargo-hack
      - run: cargo nextest run -p locallibrary --no-default-features --locked --no-fail-fast
      - run: cargo nextest run -p locallibrary-cli --no-default-features --locked --no-fail-fast
      - run: cargo nextest run -p locallibrary-cli --no-default-features --features account --locked --no-fail-fast
      - run: cargo clippy -p locallibrary-cli --no-default-features --features tui,account --all-targets --locked -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo hack clippy --workspace --feature-powerset --all-targets --locked -- -D warnings

  # Bombadil explores the TUI and the mix report (property-based UI testing; see bombadil/).
  # macOS and Linux only: Bombadil has no Windows build.
  bombadil:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: bombadil
      - run: npm run typecheck
        working-directory: bombadil
      # Chrome's headless shell: full Chrome has stalled Bombadil while the report plays audio.
      - id: chrome
        run: npx -y playwright@1.63.0 install --with-deps --only-shell chromium
      # Ubuntu's AppArmor policy keeps programs without a profile of their own, such as the
      # headless shell, from creating the user namespaces Chrome's sandbox runs in. Lifted here
      # rather than running Chrome without its sandbox.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./tui.sh
        working-directory: bombadil
        env:
          TIME_LIMIT: 2m
          OUTPUT_PATH: ${{ runner.temp }}/bombadil-tui
      # Even when the TUI run failed: the report is a separate specification.
      - if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: ./report.sh
        working-directory: bombadil
        env:
          TIME_LIMIT: 2m
          OUTPUT_PATH: ${{ runner.temp }}/bombadil-report
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bombadil-${{ matrix.os }}
          path: ${{ runner.temp }}/bombadil-*
