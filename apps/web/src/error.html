<!doctype html>
<!-- What SvelteKit sends when a request fails before a page renders, like the server hook turning someone away
from the staff console. It can't load the app's styles, so it copies the few tokens it needs. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#09090b" />
		<title>%sveltekit.status% · Local Network</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #09090b;
				color: #f4f4f5;
				font:
					16px/1.5 system-ui,
					sans-serif;
			}
			main {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
				max-width: 32rem;
				padding: 0 1rem;
				text-align: center;
			}
			p {
				margin: 0;
				color: #8b8b94;
				font-size: 0.75rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
				font-weight: 600;
			}
			a {
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				background: #f4f4f5;
				color: #09090b;
				font-weight: 500;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Error %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>
