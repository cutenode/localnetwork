# Git hooks (installed by `pnpm install`).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,js,json,css}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,js,svelte}'
      run: pnpm exec oxlint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm check
    - name: unit tests
      run: pnpm test
