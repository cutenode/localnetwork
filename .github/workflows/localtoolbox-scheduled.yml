name: localtoolbox scheduled

# Mutation testing for the Chrome extension (Stryker, see apps/localtoolbox/stryker.config.mjs),
# weekly and on demand (Actions > localtoolbox scheduled > Run workflow, on any branch). It reruns
# the tests once per mutant, which is too slow for every pull request. It fails when the score drops
# below the config's `thresholds.break`; the HTML report lists every surviving mutant.
on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/localtoolbox

# Pinned the same way as localtoolbox-ci.yml.
jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # A full run took 52 minutes on 14 workers locally; a runner has four.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Progress a line at a time: the default progress bar draws nothing without a terminal.
      - run: pnpm test:mutation --reporters html,clear-text,progress-append-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: localtoolbox-mutation
          path: apps/localtoolbox/reports/mutation/

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml).
  report:
    needs: [mutation]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      label: localtoolbox
      details: >-
        The mutation report, with every surviving mutant, is the run's localtoolbox-mutation
        artifact.
