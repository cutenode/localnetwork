name: Workflow lint

# The workflows themselves: actionlint for mistakes in their syntax, expressions and shell (with
# shellcheck, which the runner has), and zizmor for security problems such as actions not pinned
# to a commit, checkouts that keep the token, and template injection, in the workflows and the
# local actions. Config in .github/actionlint.yaml and .github/zizmor.yml; zizmor's other
# exceptions are comments on the lines they cover. ci.yml calls it when anything in .github/
# changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor
      # actionlint has no action of its own. The runner has Go, and Go checks the module against its
      # public checksum database.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          "$(go env GOPATH)/bin/actionlint"
      # Offline: the online audits look up action tags and advisories through the GitHub API.
      - run: zizmor --offline --format github --config .github/zizmor.yml .github
