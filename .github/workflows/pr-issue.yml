name: PR issue

# Fails a pull request that doesn't say which issue it's for, so the work is linked to it
# (.github/CONTRIBUTING.md, "Issues and planning"). It passes on a `bnb/loc-123-...` branch, on
# one of Linear's magic words before `LOC-123` in the description (`Fixes LOC-123`, `Part of
# LOC-123`), or when GitHub links the pull request to an issue it closes (`Fixes #123`), which it
# does only for a pull request into the default branch. It reads only the event and GitHub's API,
# never the code, so it has no files to filter and no changes job, and it runs again on each edit,
# which is why it isn't in ci.yml. The ruleset requires its passed check, so it runs on merge queue
# groups too, where it passes at once: each pull request in a group passed.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Explicitly bash, which turns pipefail on: a failure piped into tee or jq fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Bots' pull requests, such as Dependabot's, have no issue.
  issue:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # To read which issues GitHub says the pull request closes.
    permissions:
      pull-requests: read
      issues: read
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          QUERY: >-
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) { closingIssuesReferences { totalCount } }
              }
            }
        run: |
          shopt -s nocasematch
          # The template's hints are HTML comments, and their example references would count.
          body=$(perl -0pe 's/<!--.*?-->//gs' <<< "$BODY")
          # Linear's magic words, so this passes what Linear's GitHub integration links
          # (https://linear.app/docs/github#magic-words): its closing words, and its non-closing
          # ones, which link without closing. Its relation words ("related to") don't count.
          words='close|closes|closed|closing|fix|fixes|fixed|fixing|resolve|resolves|resolved|resolving'
          words+='|complete|completes|completed|completing|implement|implements|implemented|implementing'
          words+='|linear issue|ref|refs|references|part of|contributes to|toward|towards'
          linear="(^|[^[:alnum:]_])($words)[[:space:]]+loc-[0-9]+"
          if [[ $BRANCH =~ ^bnb/loc-[0-9]+- || $body =~ $linear ]]; then
            exit 0
          fi
          # A GitHub issue: GitHub's own reading of its closing keywords (Fixes #123), which only
          # ever links an issue, never a pull request.
          closes=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F number="$NUMBER" \
            -f query="$QUERY" --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')
          if ((closes > 0)); then
            exit 0
          fi
          echo "::error::Link the issue in the description: Fixes LOC-123 or Part of LOC-123 for a Linear issue, Fixes #123 for a GitHub one. Or name the branch bnb/loc-123-..."
          exit 1

  # The check the "Protect Main" ruleset requires. It runs, and fails, only when the issue job failed
  # or was skipped for anything but a merge queue group or a bot; a skipped passed job counts as
  # passing.
  passed:
    name: PR issue passed
    if: >-
      always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      || (needs.issue.result == 'skipped' && github.event_name == 'pull_request'
        && github.event.pull_request.user.type != 'Bot'))
    needs: issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: exit 1
