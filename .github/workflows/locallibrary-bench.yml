name: locallibrary benchmarks

# The criterion benchmarks in crates/*/benches/ under CodSpeed (https://codspeed.io), which
# reports how a pull request changes each one against main. CodSpeed's simulation mode counts the
# instructions a benchmark runs under Valgrind instead of timing it, so shared runners give stable
# numbers. The workspace's `criterion` dependency is CodSpeed's compatibility layer
# (codspeed-criterion-compat), which is plain criterion under `cargo bench`.
#
# Runs on the same changes as locallibrary-ci.yml (the benches are under `crates/**`), and on
# demand to measure main again.
on:
  push:
    branches: [main]
    paths: &paths
      - "apps/locallibrary/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "lexicons/**"
      - ".github/workflows/locallibrary-*.yml"
      - "!**.md"
      - "crates/*/README.md"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Pinned the same way as locallibrary-ci.yml.
jobs:
  # Whether there's anything to measure: `cargo codspeed build` fails on a workspace without
  # benchmarks, so the run is skipped until there are some.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benches: ${{ steps.find.outputs.benches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          benches=$(git ls-files '*/benches/*.rs' | wc -l)
          echo "benches=$benches" >> "$GITHUB_OUTPUT"
          if [ "$benches" = 0 ]; then echo "::notice::No benchmarks in the workspace yet"; fi

  codspeed:
    needs: find
    if: needs.find.outputs.benches != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # CodSpeed authenticates the upload with a GitHub OIDC token, which works for public and
    # private repositories alike; pull requests from forks get no token and fall back to
    # CodSpeed's tokenless upload, which only public repositories have. Without OIDC, drop
    # `id-token` and pass `token: ${{ secrets.CODSPEED_TOKEN }}` (from the repository's CodSpeed
    # settings) to the action instead.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The CLI's default `playback` feature builds ALSA's bindings, which need its headers.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Keep in step with codspeed-criterion-compat's version in Cargo.toml. It has no
      # install-action manifest, so this falls back to cargo-binstall, which fetches CodSpeed's
      # release binary.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed@5.0.2
      # Every feature, so benchmarks that need one (`test-util`) build too.
      - run: cargo codspeed build --workspace --all-features --locked -m simulation
      - uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: cargo codspeed run -m simulation
