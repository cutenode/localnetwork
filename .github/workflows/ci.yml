name: CI

# Pull requests and pushes to main run the quick checks. The slow suites (Bombadil, every feature
# combination) and a weekly advisory check are in scheduled.yml. Changes to Markdown alone skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
# Every job but msrv builds with the toolchain rust-toolchain.toml pins: `rustup toolchain
# install` with no arguments installs it, with clippy and rustfmt.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The TUI's audio output goes through ALSA on Linux. The sqlcipher CLI checks that SQLCipher
      # itself reads what locallibrary encrypts; LOCALLIBRARY_REQUIRE_SQLCIPHER makes those tests
      # fail when they can't find it, where they'd otherwise skip the check (as on Windows).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev sqlcipher
          echo LOCALLIBRARY_REQUIRE_SQLCIPHER=1 >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: |
          brew install sqlcipher
          echo LOCALLIBRARY_REQUIRE_SQLCIPHER=1 >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os != 'Linux'
        run: cargo nextest run --workspace --locked --no-fail-fast
      # Linux runs the same tests under coverage, failing below the thresholds in
      # .cargo/config.toml.
      - if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo coverage
      # nextest doesn't run doctests.
      - run: cargo test --doc --workspace --locked

  # The headless sidecar (no default features: no `account`, `tui` or `playback`) builds and
  # passes clippy without ALSA's headers. scheduled.yml runs its tests and every other combination.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p locallibrary-cli --no-default-features --locked -- -D warnings

  # The oldest Rust the workspace supports: `rust-version` in Cargo.toml (keep the two in step).
  # Only the library and the CLI, what `cargo install` builds (with their default features): the
  # tests' dev-dependencies may need a newer Rust.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Wins over rust-toolchain.toml in every step, rust-cache's included.
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo +1.89 check --workspace --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The CLI's default `playback` feature builds ALSA's bindings, which need its headers.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo doc --workspace --no-deps --locked

  # RustSec advisories, banned crates and where crates come from (see deny.toml). scheduled.yml
  # also checks advisories weekly, for ones published between pushes.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories bans licenses sources
