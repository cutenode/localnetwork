name: locallibrary cache

# locallibrary-ci.yml's other-os job, nightly on main, so the macOS and Windows caches it restores
# stay warm: only main saves caches, and ci.yml runs other-os for merge queue groups and labelled
# pull requests, never for a push to main. It's the same job, so what fails here would fail a
# merge queue group too. The apt packages every workflow installs are warmed here too, and the
# run fails when the repository's caches near GitHub's 10 GB, past which it drops the least
# recently used.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether a run would save anything. rust-cache keys other-os's caches on the manifests, the
  # lockfile, the toolchain and cargo's config, and saves nothing on an exact hit, so a night when
  # none of them changed since the last run that passed needs no run, unless GitHub evicted the
  # caches (after 7 days unread). A short Linux job, where other-os takes a macOS and a Windows
  # runner for most of an hour.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.base.outputs.sha == '' || steps.filter.outputs.cache == 'true' || steps.caches.outputs.missing == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: base
        uses: ./.github/actions/last-passed
        with:
          events: schedule workflow_dispatch
      - if: steps.base.outputs.sha != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            cache:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/locallibrary-ci.yml'
              - '.github/workflows/locallibrary-cache.yml'
      # One cache per OS, keyed `v0-rust-other-os-...` (the shared-key in locallibrary-ci.yml).
      - id: caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$GH_REPO/actions/caches?ref=refs/heads/main&key=v0-rust-other-os-&per_page=100" --jq '.total_count')
          echo "Caches for other-os on main: $count"
          echo "missing=$([ "$count" -lt 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  other-os:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # What locallibrary-ci.yml's jobs ask for, which a call has to grant even to the ones it skips
    # (its report job's comment), or GitHub won't start the run.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/locallibrary-ci.yml
    with:
      linux: false
      docs: false
      cache: false
      deny: false
      dist: false
      other-os: true
      semver: false
      commands: false

  # Each set of apt packages a workflow installs (.github/actions/apt-packages), restored or saved
  # on main every night. A pull request reads main's caches but can't see another pull request's,
  # and a push to main runs only the jobs that need libasound2-dev, so without this every other
  # set was fetched from Ubuntu's mirror by each new pull request, and failed with it. Read from the
  # workflows, so a new set is warmed without a list to edit.
  apt-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sets: ${{ steps.sets.outputs.sets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # yq is on the runner.
      - id: sets
        run: |
          sets=$(yq -o json '[.jobs[].steps[]? | select(.uses == "./.github/actions/apt-packages") | .with.packages]' \
            .github/workflows/*.yml | jq -sc 'add | unique')
          echo "Package sets: $sets"
          echo "sets=$sets" >> "$GITHUB_OUTPUT"

  apt:
    needs: apt-sets
    strategy:
      fail-fast: false
      matrix:
        packages: ${{ fromJSON(needs.apt-sets.outputs.sets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-packages
        with:
          packages: ${{ matrix.packages }}

  # Fails over 9 GiB of the 10 GB GitHub keeps, so the caches get trimmed before GitHub starts
  # dropping the least recently used ones, which were the apt packages.
  cache-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          read -r bytes count < <(gh api "repos/$GH_REPO/actions/cache/usage" \
            --jq '"\(.active_caches_size_in_bytes) \(.active_caches_count)"')
          echo "Actions caches: $count, $((bytes / 1048576)) MiB"
          if [ "$bytes" -gt $((9 * 1024 * 1024 * 1024)) ]; then
            echo "::error title=Caches near the limit::$((bytes / 1048576)) MiB of caches; GitHub drops the least recently used past 10 GB. gh cache list --sort size_in_bytes shows what to trim."
            exit 1
          fi
