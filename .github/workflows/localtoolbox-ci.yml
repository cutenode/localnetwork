name: localtoolbox CI

# Runs for changes to the Chrome extension (apps/localtoolbox), the lint and format config it shares
# with the web app, and the pnpm workspace around it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/localtoolbox

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.run == 'true' }}
    steps:
      # A pull request's files come from the API. A push is diffed against the last commit this
      # workflow passed on, so what a cancelled or failed run didn't check runs on the next push.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        id: base
        uses: ./.github/actions/last-passed
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            run:
              - 'apps/localtoolbox/**'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tools/oxlint/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/workflows/localtoolbox-ci.yml'

  verify:
    name: Format, lint, types, tests with coverage, build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm knip
      # The suite runs the real build too (test/build.test.ts) and checks what lands in dist/.
      - run: pnpm test:coverage
      # The same suite in a random order, then every test twice over, as `pnpm verify` runs it: a
      # test that leans on what an earlier one left behind fails here.
      - run: pnpm test:shuffle
      - run: pnpm test:repeat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: localtoolbox-coverage
          path: apps/localtoolbox/coverage/
      # The zip that goes to the Chrome Web Store, and the folder it unpacks to, for the report
      # job; main's runs keep theirs for pull requests to compare with.
      - run: pnpm zip
      - name: Measure the package
        run: |
          zip=$(wc -c < localtoolbox.zip)
          dist=$(find dist -type f -exec cat {} + | wc -c)
          jq -n --argjson zip "$zip" --argjson dist "$dist" \
            '{"Packaged (localtoolbox.zip)": $zip, "Unpacked (dist/)": $dist}' > sizes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sizes
          path: apps/localtoolbox/sizes.json

  # Coverage and size on the pull request, in one comment each push updates: the coverage against
  # main's latest (davelosert/vitest-coverage-report-action, with each changed file's), then the
  # package's size against main's (.github/actions/size-report). Both go to the run's summary
  # too, which is all a fork's pull request gets: its token can't comment. Not one of passed's
  # needs, so a comment that can't post never holds up a merge.
  report:
    name: Coverage and size report
    needs: [changes, verify]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # main's coverage and sizes, from its runs' artifacts.
      actions: read
      pull-requests: write
    steps:
      # For the local actions and vitest.config.ts, whose coverage thresholds the report shows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Into apps/localtoolbox/localtoolbox-coverage and apps/localtoolbox/sizes, each by name: a
      # pattern that matches only one (the other's step didn't get to upload it) unpacks it into
      # apps/localtoolbox itself. A missing one leaves only the steps that need it skipped.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: localtoolbox-coverage
          path: apps/localtoolbox/localtoolbox-coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sizes
          path: apps/localtoolbox/sizes
      - id: main-coverage
        uses: ./.github/actions/main-artifact
        with:
          name: localtoolbox-coverage
          path: ${{ runner.temp }}/main-coverage
      - if: hashFiles('apps/localtoolbox/localtoolbox-coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: apps/localtoolbox
          json-summary-path: localtoolbox-coverage/coverage-summary.json
          json-final-path: localtoolbox-coverage/coverage-final.json
          json-summary-compare-path: ${{ steps.main-coverage.outputs.found == 'true' && format('{0}/main-coverage/coverage-summary.json', runner.temp) || '' }}
      - id: size
        if: hashFiles('apps/localtoolbox/sizes/sizes.json') != ''
        uses: ./.github/actions/size-report
        with:
          sizes: apps/localtoolbox/sizes/sizes.json
          output: ${{ runner.temp }}/size.md
      # Added to the coverage action's comment, found by the marker its README documents (its
      # postfix is the working directory), so the pull request keeps one comment.
      - if: steps.size.outcome == 'success'
        uses: ./.github/actions/pr-comment
        with:
          marker: <!-- vitest-coverage-report-marker-apps/localtoolbox -->
          section: size
          body-path: ${{ runner.temp }}/size.md

  # The check the "Protect Main" ruleset requires: it fails if any job above failed or was
  # cancelled, and passes when they all passed or were skipped because nothing they check changed.
  passed:
    name: localtoolbox CI passed
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
