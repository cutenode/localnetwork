name: localtoolbox CI

# Runs for changes to the Chrome extension (apps/localtoolbox), the lint and format config it shares
# with the web app, and the pnpm workspace around it.
on:
  push:
    branches: [main]
    paths: &paths
      - apps/localtoolbox/**
      - .oxlintrc.json
      - .oxfmtrc.json
      - tools/oxlint/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/localtoolbox-ci.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/localtoolbox

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
jobs:
  verify:
    name: Format, lint, types, tests with coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm knip
      # The suite runs the real build too (test/build.test.ts) and checks what lands in dist/.
      - run: pnpm test:coverage
      # The same suite in a random order, then every test twice over, as `pnpm verify` runs it: a
      # test that leans on what an earlier one left behind fails here.
      - run: pnpm test:shuffle
      - run: pnpm test:repeat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: localtoolbox-coverage
          path: apps/localtoolbox/coverage/
