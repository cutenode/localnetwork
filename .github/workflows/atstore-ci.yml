name: atstore CI

# The AT Store pictures' generator (packages/atstore), which ci.yml calls when it, the lint and
# format config it shares with the apps, or the pnpm workspace around it changes. It checks the
# generator itself; `pnpm atstore`, which builds and runs every tool and resolves the store's
# lexicon live, runs on a machine with Docker and VHS, not here.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/atstore
    # Explicitly bash, which turns pipefail on: a failure piped into tee or jq fails the step.
    shell: bash

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
jobs:
  verify:
    name: Format, lint, types, tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # With the base the merge commit sits on, for the patch coverage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # The render tests draw the icon and the hero in Chromium.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:coverage
      # The lines the pull request changed (tools/coverage/patch.json).
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/patch-coverage
        with:
          name: atstore
          report: coverage/lcov.info
          root: packages/atstore
