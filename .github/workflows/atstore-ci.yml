name: atstore CI

# Runs for changes to the AT Store pictures' generator (packages/atstore), the lint and format
# config it shares with the apps, and the pnpm workspace around it. It checks the generator itself;
# `pnpm atstore`, which builds and runs every tool and resolves the store's lexicon live, runs on a
# machine with Docker and VHS, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/atstore

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.run == 'true' }}
    steps:
      # A pull request's files come from the API. A push is diffed against the last commit this
      # workflow passed on, so what a cancelled or failed run didn't check runs on the next push.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        id: base
        uses: ./.github/actions/last-passed
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            run:
              - 'packages/atstore/**'
              - 'apps/locallibrary/assets/icon.svg'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tools/oxlint/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/workflows/atstore-ci.yml'

  verify:
    name: Format, lint, types, tests with coverage
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm knip
      # The render tests draw the icon and the hero in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:coverage

  # Fails if any job above failed or was cancelled, and passes when they all passed or were skipped
  # because nothing they check changed.
  passed:
    name: atstore CI passed
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
