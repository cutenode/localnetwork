name: Scheduled failure issue

# The last job of each *-scheduled.yml workflow and of locallibrary-bench.yml, on their weekly
# runs: a run with a failed job opens an issue titled for the workflow, or comments on the one
# still open, and the next run that passes closes it. Runs started by hand (on any branch) leave the issue alone. The calling job
# grants the permissions below.
#
# A skipped job isn't a failure: a workflow's changes job skips its suites only when nothing they
# test changed since a run that passed. So a skip never opens an issue, and a run whose jobs all
# passed or were skipped closes the open one.
on:
  workflow_call:
    inputs:
      label:
        description: The tool's label from .github/labels.yml, added with scheduled-failure.
        type: string
        required: true
      details:
        description: Where the run keeps what its suites found, for the issue.
        type: string
        required: true

permissions: {}

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The run's jobs and their results.
      actions: read
      issues: write
    steps:
      # Failed jobs come from the API rather than the caller's `needs`, which only has each job's
      # combined result: this way each matrix leg (a mutants shard, a release target) is named.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly ${{ github.workflow }} run failed
          LABEL: ${{ inputs.label }}
          DETAILS: ${{ inputs.details }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh run view "$RUN_ID" --attempt "$ATTEMPT" --json jobs --jq '.jobs[]
            | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")
            | "- [\(.name)](\(.url))"')
          issue=$(gh issue list --label scheduled-failure --state open --limit 100 --json number,title \
            | jq --arg title "$TITLE" 'first(.[] | select(.title == $title) | .number) // empty')
          if [ -z "$failed" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Passed again: $RUN_URL"
            fi
            exit 0
          fi
          body=$(printf 'Failed in %s:\n\n%s\n\n%s\n' "$RUN_URL" "$failed" "$DETAILS")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --label scheduled-failure --label "$LABEL" --body "$body"
          fi
