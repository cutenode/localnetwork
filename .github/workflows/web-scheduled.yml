name: Web scheduled

# The end-to-end tests in every Playwright project (playwright.config.ts): Chromium, Firefox and
# WebKit on the desktop, and a Pixel 7 and an iPhone 14. Weekly and on demand (Actions > Web
# scheduled > Run workflow, on any branch), so pull requests only wait for web-ci.yml's Chromium run.
on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A second run on the same branch (say, dispatched during the weekly one) replaces the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

# Pinned the same way as web-ci.yml.
jobs:
  e2e:
    name: End-to-end (every browser and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The phones run in Chromium (Pixel 7) and WebKit (iPhone 14).
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml).
  report:
    needs: [e2e]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      label: web
      details: >-
        The Playwright report, with each failed test's trace and screenshots, is the run's
        playwright-report artifact.
