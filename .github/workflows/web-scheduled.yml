name: Web scheduled

# The end-to-end tests in every Playwright project (playwright.config.ts): Chromium, Firefox and
# WebKit on the desktop, and a Pixel 7 and an iPhone 14. Weekly and on demand (Actions > Web
# scheduled > Run workflow, on any branch), so pull requests only wait for web-ci.yml's Chromium run.
# A week that changed none of what they test skips them (see the changes job).
on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A second run on the same branch (say, dispatched during the weekly one) replaces the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

# Pinned the same way as web-ci.yml.
jobs:
  # Whether anything the end-to-end tests read changed since the last weekly or hand-started run on
  # main that passed. A run that failed doesn't count, so they run again each week until one
  # passes. Started by hand, everything runs, as it does when none of the workflow's last 100 runs
  # passed and there's nothing to compare with. The paths are what the e2e tests run: the app, the
  # tools' READMEs its home page's cards come from, and the workspace's dependencies.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The workflow's earlier runs.
      actions: read
      contents: read
    outputs:
      run: ${{ github.event_name != 'schedule' || steps.base.outputs.sha == '' || steps.filter.outputs.web == 'true' }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'schedule'
        id: base
        uses: ./.github/actions/last-passed
        with:
          events: schedule workflow_dispatch
      - if: steps.base.outputs.sha != ''
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/*/README.md'
              - 'packages/tokens/**'
              - 'lexicons/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - '.node-version'
              - '.github/workflows/web-scheduled.yml'

  e2e:
    name: End-to-end (every browser and phone)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The phones run in Chromium (Pixel 7) and WebKit (iPhone 14).
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml). A skipped run counts as passed.
  report:
    needs: [changes, e2e]
    # A week the suites skip follows one that passed, so there's no issue to close.
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.changes.outputs.run == 'true' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      label: web
      details: >-
        The Playwright report, with each failed test's trace and screenshots, is the run's
        playwright-report artifact.
