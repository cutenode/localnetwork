name: npm advisories

# Known vulnerabilities in the npm packages the website and the extension ship, the npm side of
# what `cargo deny` checks for Rust. Pull requests that change the lockfile, and weekly for
# advisories published between them. Only production dependencies: the dev tooling's advisories
# (Lighthouse, the atproto dev network) don't reach anyone using the tools, and Dependabot updates
# them monthly.
on:
  push:
    branches: [main]
    paths: &paths
      - pnpm-lock.yaml
      - .github/workflows/npm-advisories.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Reads pnpm-lock.yaml alone: nothing is installed.
      - run: pnpm audit --prod
