name: Mix report

# locallibrary writes mix reports (`mix --export`) and the web app reads them, with the format
# defined on each side. This regenerates the web app's fixture with the real writer: it fails
# when the checked-in fixture is out of date (the analysis time aside) or the reader rejects it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.run == 'true' }}
    steps:
      # A pull request's files come from the API; a push is diffed against the commit before it.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'crates/locallibrary/src/mix/**'
              - 'crates/loclib-mixid/**'
              - 'apps/locallibrary/src/mix_cmd.rs'
              - 'apps/web/src/lib/mix/**'
              - 'apps/web/scripts/mix-fixture.ts'
              - '.github/workflows/mix-report.yml'

  fixture:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      # Only main saves its cache (see locallibrary-ci.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The CLI's default features include the player's audio output, which needs ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter localnetwork fixtures:mix
      - name: The checked-in fixture is current
        run: git diff --exit-code -I '"analysedAt"' -- apps/web/src/lib/mix/fixtures
      - name: The reader accepts it
        working-directory: apps/web
        run: pnpm exec vitest run --project server src/lib/mix

  # The check the "Protect Main" ruleset requires: it fails if any job above failed or was
  # cancelled, and passes when they all passed or were skipped because nothing they check changed.
  passed:
    name: Mix report passed
    if: always()
    needs: [changes, fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
