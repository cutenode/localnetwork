name: Mix report

# locallibrary writes mix reports (`mix --export`) and the web app reads them, with the format
# defined on each side. This regenerates the web app's fixture with the real writer: it fails
# when the checked-in fixture is out of date (the analysis time aside) or the reader rejects it.
# ci.yml calls it when either side changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      # Only main saves its cache (see locallibrary-ci.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The CLI's default features include the player's audio output, which needs ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter localnetwork fixtures:mix
      - name: The checked-in fixture is current
        run: git diff --exit-code -I '"analysedAt"' -- apps/web/src/lib/mix/fixtures
      - name: The reader accepts it
        working-directory: apps/web
        run: pnpm exec vitest run --project server src/lib/mix
