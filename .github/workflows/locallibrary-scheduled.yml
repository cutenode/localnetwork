name: locallibrary scheduled

# The slow suites, weekly and on demand (Actions > locallibrary scheduled > Run workflow, on any
# branch), so pull requests only wait for locallibrary-ci.yml's quick checks: every feature
# combination, formatting and ejecting disk images, Bombadil, mutation testing, fuzzing, the Hegel
# property tests on fresh inputs, a release build of every target and a publish dry run of the
# loclib crates. A week that changed none of what they test skips them (see the changes job). Also
# a weekly RustSec check, which catches advisories published against Cargo.lock between pushes, so
# it runs every week.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Explicitly bash, which turns pipefail on: a failure piped into tee or jq fails the step.
defaults:
  run:
    shell: bash

# Pinned the same way as locallibrary-ci.yml.
jobs:
  # Whether anything the suites test changed since the last weekly or hand-started run on main that
  # passed, which every job but advisories and report needs. A run that failed doesn't count, so the
  # suites run again each week until one passes. Started by hand, everything runs, as it does when
  # none of the workflow's last 100 runs passed and there's nothing to compare with.
  # The paths are ci.yml's locallibrary ones, plus what only these suites read: the fuzz targets,
  # dist's configuration and installer for the release build, and .node-version for Bombadil's
  # specifications.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The workflow's earlier runs.
      actions: read
      contents: read
    outputs:
      run: ${{ github.event_name != 'schedule' || steps.base.outputs.sha == '' || steps.filter.outputs.locallibrary == 'true' || steps.filter.outputs.readmes == 'true' }}
      # The disk image tests, on format/ alone: they test nothing else.
      format: ${{ github.event_name != 'schedule' || steps.base.outputs.sha == '' || steps.filter.outputs.format == 'true' }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'schedule'
        id: base
        uses: ./.github/actions/last-passed
        with:
          events: schedule workflow_dispatch
      - if: steps.base.outputs.sha != ''
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            locallibrary:
              - 'apps/locallibrary/**'
              - 'crates/**'
              - 'plugins/**'
              - 'vendor/**'
              - 'packages/tokens/**'
              - 'fuzz/**'
              - '.github/actions/fuzz*/**'
              - 'tools/fuzz/**'
              - 'tools/mutants/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - 'dist-workspace.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
              - '.node-version'
              - 'lexicons/**'
              - 'about.{toml,hbs}'
              - '.github/actions/install-dist/**'
              - '.github/actions/notices/**'
              - '.github/workflows/locallibrary-scheduled.yml'
              - '!**/*.md'
            readmes:
              - 'crates/*/README.md'
            format:
              - 'crates/locallibrary/src/format/**'
              - '.github/workflows/locallibrary-scheduled.yml'

  # Every week whatever changed: advisories are published without a commit here.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
      # The fuzz targets' own lockfile, which Dependabot also bumps, against the same deny.toml.
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check advisories

  # The builds without the default features (`account`, `tui`, `playback`): a headless sidecar
  # with and without the account. No ALSA headers, which shows the builds without `playback` don't
  # need them.
  features:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # nextest's `ci` profile (.config/nextest.toml), as locallibrary-ci.yml runs it: a test that
      # hangs fails on its own, rather than holding the job until its timeout.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run -p locallibrary-core --no-default-features --locked --no-fail-fast
      - run: cargo nextest run -p locallibrary --no-default-features --locked --no-fail-fast
      - run: cargo nextest run -p locallibrary --no-default-features --features account --locked --no-fail-fast
      - run: cargo clippy -p locallibrary --no-default-features --features tui,account --all-targets --locked -- -D warnings

  # Clippy over every combination of features, in a job of its own: after the tests above it would
  # share their 45 minutes, and any of them failing would keep it from running.
  feature-powerset:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      - uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      - run: cargo hack clippy --workspace --feature-powerset --all-targets --locked -- -D warnings

  # Bombadil explores the TUI and the mix report (property-based UI testing; see
  # apps/locallibrary/bombadil/).
  # macOS and Linux only: Bombadil has no Windows build. Its last steps are the disk image tests
  # on those two systems (see disk-images), here so they don't start runners of their own.
  bombadil:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'Linux'
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
        working-directory: apps/locallibrary/bombadil
      - run: npm run typecheck
        working-directory: apps/locallibrary/bombadil
      # Chrome's headless shell: full Chrome has stalled Bombadil while the report plays audio.
      # From Bombadil's folder: the root's .npmrc keeps npm offline.
      - id: chrome
        run: npx -y playwright@1.63.0 install --with-deps --only-shell chromium
        working-directory: apps/locallibrary/bombadil
      # Ubuntu's AppArmor policy keeps programs without a profile of their own, such as the
      # headless shell, from creating the user namespaces Chrome's sandbox runs in. Lifted here
      # rather than running Chrome without its sandbox.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node tui.mjs
        working-directory: apps/locallibrary/bombadil
        env:
          TIME_LIMIT: 2m
          OUTPUT_PATH: ${{ runner.temp }}/bombadil-tui
      # Even when the TUI run failed: the report is a separate specification.
      - if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: node report.mjs
        working-directory: apps/locallibrary/bombadil
        env:
          TIME_LIMIT: 2m
          OUTPUT_PATH: ${{ runner.temp }}/bombadil-report
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bombadil-${{ matrix.os }}
          path: ${{ runner.temp }}/bombadil-*
      # Even when Bombadil failed: the disk image tests don't use it.
      - if: ${{ !cancelled() && needs.changes.outputs.format == 'true' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - if: ${{ !cancelled() && needs.changes.outputs.format == 'true' && runner.os == 'Linux' }}
        uses: ./.github/actions/apt-packages
        with:
          packages: dosfstools exfatprogs
      - if: ${{ !cancelled() && needs.changes.outputs.format == 'true' }}
        run: cargo nextest run -p locallibrary-core --lib --locked --no-fail-fast -E 'test(/^format::disk_image::/)'
        env:
          LOCALLIBRARY_DISK_IMAGE_TESTS: "1"
          NEXTEST_PROFILE: ci
          # losetup, sfdisk and mkfs need root on Linux, so the test binary runs under sudo there.
          # Only the Linux target reads this.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env
      # Drive writes run as a launchd job, end to end: a terminal, launchd and a FAT32 disk image
      # (apps/locallibrary/tests/it/launchd_writes.rs). They need the runner's logged-in session,
      # and say so when there's none.
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: cargo test --locked -p locallibrary --test it -- launchd_writes --nocapture
        env:
          LOCALLIBRARY_DISK_IMAGE_TESTS: "1"

  # format::apply and eject on a real disk: each test creates a small disk image, attaches it
  # (hdiutil, a loop device, a VHD), formats or ejects it, and detaches it
  # (crates/locallibrary/src/format/tests/disk_image.rs). Without LOCALLIBRARY_DISK_IMAGE_TESTS they
  # return at once, so no other run touches a device. macOS and Linux run them at the end of
  # bombadil; this is Windows, which has no other job here. Windows runners are administrators
  # already.
  disk-images:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LOCALLIBRARY_DISK_IMAGE_TESTS: "1"
      # nextest's `ci` profile, as the features job has it.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run -p locallibrary-core --lib --locked --no-fail-fast -E 'test(/^format::disk_image::/)'

  # Mutation testing with cargo-mutants (settings in .cargo/mutants.toml): it makes small changes
  # to the code (a function returning a default, a flipped comparison) and runs the package's
  # tests against each, to find code the tests run but don't check. A missed mutant (exit 2) fails
  # the job: the summary and the report's issue list each one (see survivors), and each shard's
  # mutants.out has their diffs. Kill it with a test, or, for an equivalent mutant (one no test can
  # tell from the code), exclude it in .cargo/mutants.toml's exclude_re with the reason above it. A
  # deleted field that makes no difference, which exclude_re doesn't leave out, can go from the code.
  # Timeouts alone (exit 3) pass: a mutant that makes the tests hang has been caught by them, and
  # a run with both fails on its missed ones. Any other exit (a build or baseline
  # test failure) fails it too.
  # Only the code changed in the past week: all of it is about 4,800 mutants and 20 runner-hours.
  # Then the survivors the open weekly issue lists, which a later week's changes don't reach, so it
  # stays open until none survive (tools/mutants/survivors.ts).
  # A whole crate runs locally with `cargo mutants -p <crate>`.
  #
  # What the shards mutate, worked out once: they each take their share of the same lists, and one run
  # again (Re-run failed jobs) takes the share it had, whatever week it is and the issue says by then.
  mutants-plan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The open weekly issue.
      issues: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      packages: ${{ steps.plan.outputs.packages }}
      more: ${{ steps.plan.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history, for the commit a week back and the listed survivors' commits.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Every workspace package but the library and the CLI (the crates below them, the plugins and
      # rekordbox-pdb), whose tests are quick enough to run once per mutant, so a new crate or plugin
      # is in without an edit here. The issue is found as scheduled-issue.yml finds it.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly ${{ github.workflow }} run
        run: |
          base=$(git rev-list -1 --first-parent --before='1 week ago' HEAD)
          [ -n "$base" ] || echo "::notice::No commit a week old to compare with"
          packages=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[].name | select(. != "locallibrary-core" and . != "locallibrary") | "-p", .')
          issue=$(gh issue list --label scheduled-failure --state open --limit 100 --json number,title \
            | jq --arg title "$TITLE" 'first(.[] | select(.title == "\($title) failed" or .title == "\($title) warned") | .number) // empty')
          : > "$RUNNER_TEMP/listed.txt"
          more=
          if [ -n "$issue" ]; then
            gh api "repos/$GH_REPO/issues/$issue" > "$RUNNER_TEMP/issue.json"
            gh api --paginate --slurp "repos/$GH_REPO/issues/$issue/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
            mapfile -t args <<< "$packages"
            cargo mutants --list --colors never "${args[@]}" > "$RUNNER_TEMP/names.txt"
            node tools/mutants/cli.ts again "$RUNNER_TEMP"/{issue.json,comments.json,names.txt} > "$RUNNER_TEMP/listed.txt"
            more=$(node tools/mutants/cli.ts more "$RUNNER_TEMP"/{issue.json,comments.json})
          fi
          delimiter=$(openssl rand -hex 16)
          {
            echo "base=$base"
            printf 'packages<<%s\n%s\n%s\n' "$delimiter" "$packages" "$delimiter"
            printf 'more<<%s\n%s\n%s\n' "$delimiter" "$more" "$delimiter"
          } >> "$GITHUB_OUTPUT"
      # In a file: Linux takes 128 KiB in an environment variable, which a few long lists pass.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: listed-survivors
          path: ${{ runner.temp }}/listed.txt

  # Survivors cut from a list too long for an issue, which nothing makes again. Failing keeps every
  # later run from counting as the last that passed, and so from skipping the week and closing the
  # issue, until someone has closed it by hand.
  survivors-cut:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.more != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MORE: ${{ needs.mutants-plan.outputs.more }}
        run: |
          echo "$MORE"
          exit 1

  mutants:
    needs: mutants-plan
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Keep the number of shards in step with the matrix. At 4, a week's diff was about 372
      # mutants a shard at 13 to 30 s each, past the step's 90 minutes (run 40313079235).
      SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history, for the commit a week back.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,cargo-mutants@27.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: listed-survivors
          path: ${{ runner.temp }}
      # `--in-place` mutates this checkout rather than a copy of it. A step timeout, inside the job's,
      # still leaves the partial results to report and upload.
      - timeout-minutes: 90
        env:
          BASE: ${{ needs.mutants-plan.outputs.base }}
          PACKAGES: ${{ needs.mutants-plan.outputs.packages }}
          # Each test process gets at most 2 GiB of data (prlimit as nextest's target runner), so a
          # mutant that grows an allocation without bound fails its test on an allocation error.
          # Unlimited, a mutant that made the resampler's weights millions of taps long filled the
          # runner's 16 GB, and the runner lost its connection with the shard's results unsaved.
          # Unmutated, every test here runs within 1 GiB, and nextest runs four at a time here.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --data=2147483648
        run: |
          mapfile -t packages <<< "$PACKAGES"
          # A mutant that timed out (3) is as good as caught, and a missed one (2) waits for the rest.
          mutate() {
            local status=0
            cargo mutants --in-place --shard "$SHARD" "$@" "${packages[@]}" || status=$?
            case $status in 0 | 2 | 3) ;; *) exit "$status" ;; esac
          }
          if [ -n "$BASE" ]; then
            git diff "$BASE" HEAD > "$RUNNER_TEMP/week.diff"
            mutate --in-diff "$RUNNER_TEMP/week.diff"
          fi
          if [ -s "$RUNNER_TEMP/listed.txt" ]; then
            mapfile -t listed < "$RUNNER_TEMP/listed.txt"
            # With a baseline of its own: the one before ran only the packages the week changed, and
            # tests that fail unmutated would count every mutant as caught.
            mkdir -p mutants.out/listed
            mutate --output mutants.out/listed "${listed[@]}"
          fi
          # Missed ones fail the shard whichever status cargo-mutants exited with.
          if [ -s mutants.out/missed.txt ] || [ -s mutants.out/listed/mutants.out/missed.txt ]; then exit 2; fi
      - if: ${{ !cancelled() && hashFiles('mutants.out/**/outcomes.json') != '' }}
        run: |
          {
            echo "## Mutants, shard $SHARD"
            for out in mutants.out mutants.out/listed/mutants.out; do
              [ -f "$out/outcomes.json" ] || continue
              echo
              if [ "$out" != mutants.out ]; then printf 'Listed in the open issue, again: '; fi
              jq -r '"\(.total_mutants) mutants: \(.caught) caught, \(.missed) missed, \(.timeout) timed out, \(.unviable) unviable"' "$out/outcomes.json"
              if [ -s "$out/missed.txt" ]; then
                echo
                echo '```'
                cat "$out/missed.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  # Every shard's missed mutants, each as `file:line:column: change`, for the report's issue, cut to
  # what an issue holds.
  survivors:
    needs: mutants
    if: ${{ !cancelled() && needs.mutants.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: mutants
      # Empty when no shard missed one (a build or baseline test failure failed the job instead).
      # When only one shard kept anything, it's straight in mutants/, without a folder of its own.
      - id: list
        run: |
          list=$(node tools/mutants/cli.ts list mutants "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          delimiter=$(openssl rand -hex 16)
          {
            echo "list<<$delimiter"
            echo "$list"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # libFuzzer feeds the parsers of what a drive, an import or another computer hands locallibrary,
  # and PdbEditor's edits, inputs grown from the test fixtures: every target `cargo fuzz list` names
  # for five minutes, several at once (.github/actions/fuzz, see CONTRIBUTING.md). One job runs them
  # all, so the targets' shared dependencies build once. The corpus each run grows is minimized and
  # kept as an artifact for the next one, for fuzz-coverage, and for pull requests' smoke runs and
  # replays (locallibrary-ci.yml). Only a crash fails the job, and uploads its input.
  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # The corpus the last run kept.
      actions: read
      contents: read
    outputs:
      refused: ${{ steps.corpus.outputs.refused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-artifact
        id: corpus
        with:
          name: fuzz-corpus
          path: fuzz/corpus
      - if: steps.corpus.outputs.refused == 'true'
        run: echo "GitHub refused the last fuzz corpus, so this run starts from the seeds and keeps neither its corpus nor its coverage. The last one stays the newest." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/fuzz
        with:
          targets: all
          seconds: 300
      # Down to the inputs that each add coverage, so the corpus doesn't grow every week. Kept even
      # when a target crashed, so what it found before isn't lost. Not when GitHub refused the last
      # one: what grew from the seeds alone would take its place.
      - if: ${{ !cancelled() && steps.corpus.outputs.refused != 'true' }}
        run: cargo fuzz list | while read -r target; do cargo +nightly fuzz cmin "$target" "fuzz/corpus/$target"; done
      - if: ${{ !cancelled() && steps.corpus.outputs.refused != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Each fuzz target's coverage: the corpus the fuzz job kept, replayed without fuzzing
  # (.github/actions/fuzz-coverage), as a share of the code the target's header names
  # (tools/fuzz/targets.ts), against main's last weekly numbers. A drop warns, in the summary and the report's issue, and
  # never fails the job. Skipped when GitHub refused the last corpus. The numbers are kept as the
  # fuzz-coverage artifact, which the next run and pull requests' replays compare with, and each
  # target's HTML report as fuzz-coverage-html.
  fuzz-coverage:
    needs: fuzz
    if: ${{ !cancelled() && needs.fuzz.result != 'skipped' && needs.fuzz.outputs.refused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # main's last numbers.
      actions: read
      contents: read
    outputs:
      drops: ${{ steps.drops.outputs.drops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/fuzz reads the targets' paths with picomatch.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter localnetwork-monorepo --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-corpus
          path: fuzz/corpus
      - uses: ./.github/actions/fuzz-artifact
        with:
          name: fuzz-coverage
          path: ${{ runner.temp }}/fuzz-coverage-last
      - uses: ./.github/actions/fuzz-coverage
        with:
          targets: all
          last: ${{ runner.temp }}/fuzz-coverage-last/coverage.json
          out: ${{ runner.temp }}/fuzz-coverage
      - id: drops
        run: |
          drops=$RUNNER_TEMP/fuzz-coverage/drops.md
          [ -s "$drops" ] || exit 0
          delimiter=$(openssl rand -hex 16)
          {
            echo "drops<<$delimiter"
            echo "Fuzz coverage dropped since main's last weekly run (each target's report is in fuzz-coverage-html):"
            echo
            cat "$drops"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage
          path: ${{ runner.temp }}/fuzz-coverage/coverage.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage-html
          path: ${{ runner.temp }}/fuzz-coverage/html
          retention-days: 14

  # The Hegel property tests over and over for 40 minutes a shard, each pass on fresh inputs, where
  # locallibrary-ci.yml replays the same derandomised ones every time. A run keeps going after a
  # failure to find others, and the failing examples it finds are cached for the next run to try
  # first; a failure fails the job and prints the line that replays it.
  hegel:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Keep the number of shards in step with the matrix. Hashed, so a test stays in its shard
      # and with its cached examples.
      SHARD: hash:${{ matrix.shard }}/4
      # Over the `ci` profile Hegel picks on CI, which derandomises and has no database.
      HEGEL_DERANDOMIZE: "false"
      HEGEL_DATABASE: ${{ github.workspace }}/.hegel
      HEGEL_STOP_ON_FIRST_FAILURE: "false"
      # nextest's `hegel` profile (.config/nextest.toml), which picks the Hegel tests over the
      # `ci` profile the features job has: a pass that hangs fails on its own, and the shard goes
      # on to the next instead of sitting there until the job's timeout.
      NEXTEST_PROFILE: hegel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # As locallibrary-ci-os.yml's Linux shards have them.
      - uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev sqlcipher
      - run: echo LOCALLIBRARY_REQUIRE_SQLCIPHER=1 >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Each run saves under its own key, and the next run restores the newest.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hegel
          key: hegel-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: hegel-${{ matrix.shard }}-
      - run: cargo nextest run --workspace --locked --no-fail-fast --partition "$SHARD" --stress-duration 40m
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hegel
          key: hegel-${{ matrix.shard }}-${{ github.run_id }}

  # dist's release build of every target, unsigned and without a tag or a GitHub Release, so a
  # change that breaks packaging shows here rather than when a version is tagged. The same jobs as
  # locallibrary-release.yml's plan, build-local-artifacts and build-global-artifacts, minus
  # signing and notarization: the matrix comes from `dist plan`, and the global job builds the
  # installers, formula and checksums over every target's archive.
  release-plan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: ./.github/actions/install-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
          retention-days: 1
      - id: plan
        run: |
          dist plan --output-format=json > plan.json
          echo "matrix=$(jq -c .ci.github.artifacts_matrix plan.json)" >> "$GITHUB_OUTPUT"

  release-build:
    name: release-build (${{ join(matrix.targets, ', ') }})
    needs: release-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.release-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: ./.github/actions/install-dist
      # The apt packages dist-workspace.toml lists. They come from `dist plan` over this checkout's
      # own configuration, with no input from a pull request (this workflow doesn't run on them).
      - if: matrix.packages_install
        run: ${{ matrix.packages_install }} # zizmor: ignore[template-injection]
      # The archives include the notices, as locallibrary-release.yml's do.
      - uses: ./.github/actions/notices
      # dist only signs the macOS binaries when the CODESIGN_* variables are set, which they
      # aren't here.
      - id: dist
        shell: bash
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
          MANIFEST: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
        run: |
          # dist's own message ends a failure as an error, so the run's summary says what failed, not
          # only dist's exit code. Its output still shows as it runs.
          # shellcheck disable=SC2086 # the arguments are words
          if ! dist build --print=linkage --output-format=json $DIST_ARGS 2>&1 >dist-manifest.json | tee dist.log; then
            sed -n 's/^ *× *//p' dist.log | sed 's/^/::error title=dist build::/'
            exit 1
          fi
          cp dist-manifest.json "$MANIFEST"
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "$MANIFEST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # What this target's release weighs, against benchmarks/budgets/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - shell: bash
        env:
          TARGET: ${{ join(matrix.targets, '_') }}
        run: |
          mkdir -p target/budgets
          # The size of the one file of these that exists: the binary, then the archive dist made
          # (.tar.xz, or .zip on Windows), not the .sha256 beside it. None or two fails the step. The
          # binary is named for the runner's OS: Git Bash's `-f locallibrary` is true for
          # locallibrary.exe too.
          size() {
            local found=() file
            for file; do [ -f "$file" ] && found+=("$file"); done
            if [ ${#found[@]} -ne 1 ]; then
              echo "::error::Expected one of $*, found ${#found[@]}" >&2
              return 1
            fi
            wc -c < "${found[0]}"
          }
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          binary=$(size "target/$TARGET/dist/locallibrary$exe")
          archive=$(size "target/distrib/locallibrary-$TARGET.tar.xz" "target/distrib/locallibrary-$TARGET.zip")
          jq -n --argjson binary "$binary" --argjson archive "$archive" \
            '{"locallibrary": $binary, "archive": $archive}' > "target/budgets/size-$TARGET.json"
          # No run measures these targets between weekly ones, so there's no base: the table is a record.
          node tools/budgets/cli.ts check "$TARGET" target/no-base target/budgets | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: ${{ steps.dist.outputs.paths }}
          retention-days: 1
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-${{ join(matrix.targets, '_') }}
          path: target/budgets
          if-no-files-found: ignore
          retention-days: 14

  release-global:
    needs: release-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - run: dist build --artifacts=global

  # `cargo publish --dry-run` over every crate that isn't `publish = false` (`--workspace` skips
  # those): each packaged and built from its .crate alone, as crates.io would get it. Pull requests
  # that change a manifest only package them (`node tools/crates-io/cli.ts package` in
  # locallibrary-ci.yml's lint job), since this builds them all. A version crates.io already has is a
  # warning in a dry run, not a failure. None of the crates needs a system package to build.
  publish-dry-run:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo publish --workspace --dry-run --locked

  # Weekly runs only: a failed job (survivors cut from a list too, see survivors-cut), or a drop in
  # fuzz coverage, opens an issue, or comments on the open one, and the next run that passes without
  # one closes it (scheduled-issue.yml). Skipped suites count as passed.
  report:
    needs:
      [changes, advisories, features, feature-powerset, bombadil, disk-images, mutants-plan, survivors-cut, mutants, survivors, fuzz, fuzz-coverage, hegel, release-plan, release-build, release-global, publish-dry-run]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      label: locallibrary
      findings: |-
        ${{ needs.survivors.outputs.list }}

        ${{ needs.mutants-plan.outputs.more }}

        ${{ needs.fuzz-coverage.outputs.drops }}
      details: >-
        Each job's log is on the run page. Surviving mutants are also in the run's summary, one
        section per mutants shard, with their diffs in the mutants-N artifacts. Bombadil's traces
        are in the bombadil-OS artifacts, a fuzz crash's input in fuzz-artifacts and each fuzz
        target's coverage report in fuzz-coverage-html.
