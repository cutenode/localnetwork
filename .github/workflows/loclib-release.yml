name: loclib release

# Publishes the loclib crates to crates.io with trusted publishing, so no crates.io token is stored
# anywhere: crates.io trusts this file, run in the crates-io environment, to publish each crate,
# and release-plz trades the job's OIDC token for a token that lasts minutes. On a push to main
# that changes a loclib crate's Cargo.toml, `release-plz release` publishes each crate whose
# version crates.io doesn't have yet, dependencies first, and tags it `<crate>-v<version>`.
#
# Until crates.io has a trusted publisher for this repository (`node tools/crates-io/cli.ts setup`
# sets it up), it turns the exchange down, and the run skips publishing with a notice instead of
# failing on main. It does the same while crates.io doesn't have a publishable crate yet, whose
# first version trusted publishing can't make.
#
# Versions and changelogs change in ordinary pull requests (`release-plz update`, see "Releasing
# crates" in apps/locallibrary/CONTRIBUTING.md). crates.io can't take a crate's first version
# this way: `node tools/crates-io/cli.ts setup` publishes new crates and sets up their trusted
# publisher.
on:
  push:
    branches: [main]
    paths:
      - 'crates/loclib-*/Cargo.toml'
  workflow_dispatch:

permissions: {}

# Explicitly bash, which turns pipefail on: a failure piped into tee or jq fails the step.
defaults:
  run:
    shell: bash

# One release at a time, and never cancelled halfway through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      # The tags.
      contents: write
      # The OIDC token crates.io trades for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads the tags to find each crate's last release.
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      # tools/crates-io needs only Node: it uses none of the root's packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The crates crates.io doesn't have yet (tools/crates-io/names.ts). release-plz would try their
      # first versions through trusted publishing, which crates.io turns down, so nothing is
      # published until setup has published them.
      - id: new
        run: |
          crates=$(node tools/crates-io/cli.ts new | paste -sd ' ' -)
          if [ -n "$crates" ]; then
            echo "::notice title=Not published::crates.io doesn't have $crates yet, so no loclib crate was published. node tools/crates-io/cli.ts setup publishes their first versions."
          fi
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      # The exchange release-plz makes, tried first: crates.io answers 400 with "No Trusted
      # Publishing config found" until the trusted publisher exists. Any other refusal fails the
      # run. The token a success gets is revoked at once; release-plz gets its own.
      - id: trusted
        if: steps.new.outputs.crates == ''
        run: |
          response="$RUNNER_TEMP/crates-io.json"
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" |
            jq '{jwt: .value}' > "$RUNNER_TEMP/jwt.json"
          status=$(curl -sS -o "$response" -w '%{http_code}' -H 'Content-Type: application/json' \
            --data "@$RUNNER_TEMP/jwt.json" https://crates.io/api/v1/trusted_publishing/tokens)
          rm "$RUNNER_TEMP/jwt.json"
          if [ "$status" = 200 ]; then
            token=$(jq -r .token "$response")
            echo "::add-mask::$token"
            curl -fsS -X DELETE -H "Authorization: Bearer $token" https://crates.io/api/v1/trusted_publishing/tokens
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 400 ] && jq -e 'any(.errors[]; .detail | startswith("No Trusted Publishing config found"))' "$response" > /dev/null; then
            echo "::notice title=Not published::crates.io has no trusted publisher for this repository yet, so no loclib crate was published. node tools/crates-io/cli.ts setup sets one up."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=crates.io token exchange::HTTP $status: $(cat "$response")"
            exit 1
          fi
      - if: steps.trusted.outputs.configured == 'true'
        uses: release-plz/action@1fb72a9583c3601c197b3bd6fc6ce50d58e28ef3 # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
