name: Web CI

# Runs for changes to the web app (apps/web), the lint and format config it shares, the pnpm
# workspace around it, and what its Docker image copies in from outside apps/web: the shared
# tokens, and the tools' READMEs and docs for their pages (see .dockerignore).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

# Actions are pinned to commits, as in locallibrary-ci.yml. Firefox, WebKit and the phone viewports
# run weekly in web-scheduled.yml; pull requests run the e2e tests in Chromium only.
jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.run == 'true' }}
      lighthouse: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.lighthouse == 'true' }}
    steps:
      # A pull request's files come from the API; a push is diffed against the commit before it.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            run:
              - 'apps/web/**'
              - 'apps/*/README.md'
              - 'apps/*/docs/*.md'
              - 'README.md'
              - '.github/CONTRIBUTING.md'
              - '.github/SECURITY.md'
              - '.github/labels.yml'
              - 'packages/tokens/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.dockerignore'
              - 'lexicons/**'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tools/oxlint/**'
              - '.github/workflows/web-ci.yml'
            # What the pages Lighthouse measures are built and served from: the app's code, static
            # files and Lua (HappyView answers the directory's queries), the dev network and seed
            # data it measures them on, its build and Lighthouse config, the dependencies, and the
            # README and guides of the one tool page lighthouserc.cjs visits (add a tool here when
            # its page goes in there). Left out: the app's tests and the helpers and fixture only
            # they import (src/lib/server/testing, the mix fixture), stories and Storybook docs, and
            # everything outside these paths (tests/, .storybook/, the lint and format configs, the
            # website's README, the Dockerfile).
            lighthouse:
              - 'apps/web/src/**'
              - 'apps/web/static/**'
              - 'apps/web/lua/**'
              - 'apps/web/scripts/**'
              - 'apps/web/package.json'
              - 'apps/web/vite.config.ts'
              - 'apps/web/tsconfig.json'
              - 'apps/web/lighthouserc.cjs'
              - 'apps/locallibrary/README.md'
              - 'apps/locallibrary/docs/*.md'
              - 'packages/tokens/**'
              - 'lexicons/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/workflows/web-ci.yml'
              - '!apps/web/**/*.test.ts'
              - '!apps/web/**/*.spec.ts'
              - '!apps/web/**/*.stories.svelte'
              - '!apps/web/**/*.mdx'
              - '!apps/web/src/lib/server/testing/**'
              - '!apps/web/src/lib/mix/fixtures/**'

  # `pnpm test:build` builds the app and checks what ships to the browser: no sourcemaps, and the
  # client bundle within its budget.
  verify:
    name: Format, lint, types, unit tests, stories, build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Lexicon formatting
        working-directory: .
        run: pnpm lexicons:format --check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:storybook
      - run: pnpm test:build
      # What the browser downloads, for the report job; main's runs keep theirs for pull requests
      # to compare with. adapter-node writes a brotli copy beside each file (precompress), which is
      # what the server sends a browser that takes it.
      - name: Measure the client bundle
        run: |
          bytes() { find build/client -type f -name "$1" -exec cat {} + | wc -c; }
          jq -n --argjson js "$(bytes '*.js')" --argjson js_br "$(bytes '*.js.br')" \
            --argjson css "$(bytes '*.css')" --argjson css_br "$(bytes '*.css.br')" \
            '{"Client JavaScript": $js, "Client JavaScript, brotli": $js_br,
              "Client CSS": $css, "Client CSS, brotli": $css_br}' > sizes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sizes
          path: apps/web/sizes.json

  integration:
    name: Integration (real spaces PDS) + coverage
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: apps/web/coverage/

  # Every page the tests visit also goes through axe (tests/e2e/axe.ts).
  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - run: pnpm test:e2e --project chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # Lighthouse on the production build, with the e2e tests' network and seeded projects behind it,
  # against the floors and budgets in lighthouserc.cjs, when something the pages are built from
  # changed (the changes job's lighthouse filter). The scores and any failed assertion go to the
  # run's summary and the reports to its artifacts, not to a Lighthouse server.
  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Lighthouse starts Playwright's Chromium itself, with its sandbox. Ubuntu's AppArmor policy
      # keeps programs without a profile of their own from creating the user namespaces the sandbox
      # runs in. Lifted here rather than running Chromium without its sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - run: pnpm test:lighthouse
      # Each page's scores from the run lhci reports as representative (its median), then each
      # assertion that failed: lhci writes both even when one does.
      - name: Scores to the run's summary
        if: ${{ !cancelled() && hashFiles('apps/web/lighthouse-report/manifest.json') != '' }}
        run: |
          {
            echo "## Lighthouse"
            echo
            echo "| Page | Performance | Accessibility | Best practices | SEO |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            jq -r '.[] | select(.isRepresentativeRun) | .summary as $s
              | "| \(.url | sub("^https?://[^/]+"; "")) | \([$s.performance, $s.accessibility, $s["best-practices"], $s.seo]
                | map(. * 100 | round) | join(" | ")) |"' lighthouse-report/manifest.json
            # An empty list when every assertion passed.
            if jq -e 'length > 0' .lighthouseci/assertion-results.json > /dev/null 2>&1; then
              echo
              echo "Failed:"
              echo
              jq -r '.[] | "- \(.url | sub("^https?://[^/]+"; "")): \(.auditId)\(.auditProperty // "" | if . != "" then ".\(.)" else "" end)"
                + " was \(.actual * 100 | round / 100), expected \(.operator) \(.expected)"' .lighthouseci/assertion-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report/

  # The image as it's deployed: built from the repo root, then started with an empty volume at
  # /data against the local network and asked for a few pages (scripts/docker-smoke.sh). The
  # network runs from the workspace, so it's installed here too.
  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # The image is built to be run here, never pushed, so there's nothing a poisoned cache could
      # reach beyond this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm # zizmor: ignore[cache-poisoning]
      - run: pnpm install --frozen-lockfile
      - name: Pull the HappyView image (scripts/lib/happyview.ts)
        run: docker pull ghcr.io/gamesgamesgamesgamesgames/happyview:2.16.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: localnetwork:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke.sh localnetwork:ci

  # Coverage and size on the pull request, in one comment each push updates: the integration job's
  # coverage against main's latest (davelosert/vitest-coverage-report-action, with each changed
  # file's), then the client bundle's size against main's (.github/actions/size-report). Both go
  # to the run's summary too, which is all a fork's pull request gets: its token can't comment.
  # Not one of passed's needs, so a comment that can't post never holds up a merge.
  report:
    name: Coverage and size report
    needs: [changes, verify, integration]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # main's coverage and sizes, from its runs' artifacts.
      actions: read
      pull-requests: write
    steps:
      # For the local actions and vite.config.ts, whose coverage thresholds the report shows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Into apps/web/coverage and apps/web/sizes. An artifact whose job failed before uploading it
      # is missing, and the steps that need it skip.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{coverage,sizes}"
          path: apps/web
      - id: main-coverage
        uses: ./.github/actions/main-artifact
        with:
          name: coverage
          path: ${{ runner.temp }}/main-coverage
      - if: hashFiles('apps/web/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: apps/web
          json-summary-compare-path: ${{ steps.main-coverage.outputs.found == 'true' && format('{0}/main-coverage/coverage-summary.json', runner.temp) || '' }}
      - id: size
        if: hashFiles('apps/web/sizes/sizes.json') != ''
        uses: ./.github/actions/size-report
        with:
          sizes: apps/web/sizes/sizes.json
          output: ${{ runner.temp }}/size.md
      # Added to the coverage action's comment, found by the marker its README documents (its
      # postfix is the working directory), so the pull request keeps one comment.
      - if: steps.size.outcome == 'success'
        uses: ./.github/actions/pr-comment
        with:
          marker: <!-- vitest-coverage-report-marker-apps/web -->
          section: size
          body-path: ${{ runner.temp }}/size.md

  # The check the "Protect Main" ruleset requires: it fails if any job above failed or was
  # cancelled, and passes when they all passed or were skipped because nothing they check changed.
  passed:
    name: Web CI passed
    if: always()
    needs: [changes, verify, integration, e2e, lighthouse, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: .
        run: exit 1
