name: Repo scheduled

# The repository-wide checks that ask other sites, weekly and by hand rather than on every pull
# request: the links in the Markdown to other sites (repo-checks.yml checks the relative ones on
# each pull request), and zizmor's online audits of the workflows (workflow-lint.yml runs the
# offline ones), which look up each pinned action's tags and advisories through the GitHub API.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Loopback and private addresses are the local network's own (pnpm dev). The lychee cache keeps
  # a week's answers, so a re-run asks only about links that failed.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      # The action pins lychee 0.24.2.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --include-fragments --no-progress --exclude-loopback --exclude-private
            --cache --max-cache-age 7d --cache-exclude-status 400..
            './**/*.md'

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.31.1
      - run: zizmor --format github --config .github/zizmor.yml .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it (scheduled-issue.yml).
  report:
    needs: [links, zizmor]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      label: tooling
      details: >-
        The links job's log lists each broken link with the file and line it's on, and the zizmor
        job's annotations each finding in the workflow it's in.
