name: PR labels

# Labels each pull request with the tools, areas and kinds of file it changes (.github/labeler.yml).
# pull_request_target is what lets it label pull requests from forks. It runs this workflow and the
# config as they are on main, and never checks out or runs the pull request's code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
