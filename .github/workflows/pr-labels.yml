name: PR labels

# Labels every pull request with the tools, areas and kinds of file it changes
# (.github/labeler.yml). pull_request_target runs this workflow and the config as they are on main,
# and never checks out or runs the pull request's code. It also runs when the pull request
# conflicts with main, where pull_request workflows don't, and gives a fork's pull request a token
# that can label it. `reopened` labels a pull request that was closed before it got its labels.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Explicitly bash, which turns pipefail on: a failure piped into tee or jq fails the step.
defaults:
  run:
    shell: bash

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
