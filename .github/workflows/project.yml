name: Project

# Keeps the organization's projects in step with tools/project.sh. Every run syncs every project
# (issues are added to the projects whose scope they're in and taken off the ones they've left,
# get their Product or Area, and have the same Status everywhere), then gives open issues without
# a type the one their labels stand for. A change to the projects' files on main applies them
# before syncing. The schedule picks up what no event here reports: a Status changed on a project, a
# Priority set, a pull request that closes an issue, and issues opened by other workflows, which
# GITHUB_TOKEN's events don't start workflows for.
#
# GITHUB_TOKEN can't reach an organization's projects, so syncing runs on the PROJECT_TOKEN secret:
# a fine-grained token for the organization with its Projects permission (read and write) and this
# repository's Issues and Pull requests (read). Without it, only the types step runs.
on:
  issues:
    types: [opened, reopened, transferred, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  push:
    branches: [main]
    paths:
      - .github/project.json
      - .github/projects/**
      - .github/labels.yml
      - .github/workflows/project.yml
      - tools/project.sh
      - tools/project/**
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

# Each run syncs everything, so a newer one replaces any that's waiting or running. A new issue's
# form adds its labels one event at a time: the last event's run sees them all. Applying has a
# group of its own, so an issue's run never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'apply' || 'sync' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Setting issue types, from a read of the issues that includes the pull requests closing them.
      issues: write
      pull-requests: read
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.PROJECT_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PROJECT_TOKEN }}
          COMMAND: ${{ github.event_name == 'push' && 'apply' || 'sync' }}
        run: tools/project.sh "$COMMAND"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/project.sh types
