name: locallibrary CI

# Pull requests and pushes to main that touch the Rust workspace run the quick checks. The slow
# suites (Bombadil, every feature combination, mutation testing, fuzzing, the CLI's timings, a
# release build) and a weekly advisory check are in locallibrary-scheduled.yml, and the benchmarks
# in locallibrary-bench.yml. Changes to Markdown alone skip CI, except the crates' READMEs, which are
# their crate docs and doctests (the paths are in the changes job).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
# Every job but msrv builds with the toolchain rust-toolchain.toml pins: `rustup toolchain
# install` with no arguments installs it, with clippy and rustfmt.
jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything.
    outputs:
      run: ${{ github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.rust == 'true' || steps.filter.outputs.readmes == 'true' }}
      semver: ${{ github.event_name == 'pull_request' && (github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.semver == 'true') }}
    steps:
      # A pull request's files come from the API; a push is diffed against the commit before it.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - 'apps/locallibrary/**'
              - 'crates/**'
              - 'plugins/**'
              - 'vendor/**'
              - 'packages/tokens/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'lexicons/**'
              - '.github/workflows/locallibrary-*.yml'
              - '!**/*.md'
            readmes:
              - 'crates/*/README.md'
            semver:
              - 'crates/loclib-*/**'
              - 'Cargo.toml'
              - '.github/workflows/locallibrary-ci.yml'
              - '!crates/*/tests/**'
              - '!crates/*/examples/**'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only main saves its caches, which pull requests restore. A cache saved by each pull request
      # would push main's out of the repo's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The tests' temporary folders go on a Dev Drive: on the runner's C: drive, Defender scans
      # every file they make and each flush takes milliseconds, which made the tests that write
      # files run several times longer than on macOS or Linux. Defender's performance mode only
      # applies to a trusted Dev Drive, and the runner is thrown away after the job.
      - if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 10GB
          trusted-dev-drive: true
          env-mapping: |
            TMP,{{ DEV_DRIVE }}
            TEMP,{{ DEV_DRIVE }}
      # The TUI's audio output goes through ALSA on Linux. The sqlcipher CLI checks that SQLCipher
      # itself reads what locallibrary encrypts; LOCALLIBRARY_REQUIRE_SQLCIPHER makes those tests
      # fail when they can't find it, where they'd otherwise skip the check (as on Windows).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev sqlcipher
          echo LOCALLIBRARY_REQUIRE_SQLCIPHER=1 >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: |
          brew install sqlcipher
          echo LOCALLIBRARY_REQUIRE_SQLCIPHER=1 >> "$GITHUB_ENV"
      # Windows runners run as an administrator, and locallibrary starts no plugin from an elevated
      # process; debug builds take this to mean it isn't, so the tests can start theirs.
      - if: runner.os == 'Windows'
        shell: bash
        run: echo LOCALLIBRARY_TEST_NOT_ELEVATED=1 >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin tests run in the plugins job below.
      - if: runner.os != 'Linux'
        run: cargo nextest run --workspace --locked --no-fail-fast --profile core
      # Linux runs every test under coverage, the plugin tests too, failing below the thresholds in
      # .cargo/config.toml. It writes its totals as JSON for the summary below, in place of the
      # per-file table.
      - if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo coverage --json --summary-only --output-path target/coverage.json
      # To the run's summary, and for the report job to put on the pull request.
      - if: runner.os == 'Linux' && !cancelled()
        name: Coverage summary
        run: |
          totals() {
            if [ -f "$2" ]; then
              jq -r --arg tests "$1" '.data[0].totals | "| \($tests) | \([.lines, .functions, .regions]
                | map("\(.percent * 100 | round / 100)% (\(.covered)/\(.count))") | join(" | ")) |"' "$2"
            fi
          }
          {
            echo "## Rust coverage"
            echo
            echo "From [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Held to the thresholds in .cargo/config.toml."
            echo
            echo "| Tests | Lines | Functions | Regions |"
            echo "| --- | ---: | ---: | ---: |"
            totals All target/coverage.json
          } | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage.md
          if-no-files-found: ignore
      # nextest doesn't run doctests.
      - run: cargo test --doc --workspace --locked

  # The plugin tests (see .config/nextest.toml), apart from the rest. Linux runs them under
  # coverage in the test job.
  plugins:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Only main saves this cache, which pull requests restore.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # As in the test job: the runner is elevated, the tests' plugins must start anyway.
      - if: runner.os == 'Windows'
        shell: bash
        run: echo LOCALLIBRARY_TEST_NOT_ELEVATED=1 >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast --profile plugins

  # The headless sidecar (no default features: no `account`, `tui` or `playback`) builds and
  # passes clippy without ALSA's headers. locallibrary-scheduled.yml runs its tests and every
  # other combination.
  features:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p locallibrary-cli --no-default-features --locked -- -D warnings

  # The oldest Rust the workspace supports: `rust-version` in Cargo.toml (keep the two in step).
  # Only the library and the CLI, what `cargo install` builds (with their default features): the
  # tests' dev-dependencies may need a newer Rust.
  msrv:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Wins over rust-toolchain.toml in every step, rust-cache's included.
      RUSTUP_TOOLCHAIN: "1.91"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo +1.91 check --workspace --locked

  docs:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The CLI's default `playback` feature builds ALSA's bindings, which need its headers.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo doc --workspace --no-deps --locked

  # RustSec advisories, banned crates and where crates come from (see deny.toml).
  # locallibrary-scheduled.yml also checks advisories weekly, for ones published between pushes.
  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories bans licenses sources

  # Breaking changes to the public API of the loclib-* libraries, against the branch a pull request
  # merges into. None of them is on crates.io yet, so this is a note for maintainers deciding the
  # next version, not a gate: what broke goes to the run's summary and a warning, and the job
  # passes either way. It isn't in `passed`'s needs, so a pull request never waits on it.
  semver:
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The merge commit and its first parent, the base branch the pull request merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: rustup toolchain install
      # No rust-cache: only main saves caches, and this job never runs there. cargo-semver-checks
      # builds each crate, and its baseline, in a target directory of its own anyway.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks
      - name: Check the loclib-* crates against the base branch
        run: |
          base=$(git rev-parse HEAD^1)
          crates=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name | select(startswith("loclib-"))')
          breaking=()
          errors=()
          for crate in $crates; do
            out="$RUNNER_TEMP/$crate.txt"
            if cargo semver-checks --package "$crate" --baseline-rev "$base" --color never > "$out" 2>&1; then
              continue
            fi
            cat "$out"
            # Breaking changes end the output with "Summary semver requires new major version" (or
            # minor). Anything else, such as a crate the base doesn't have yet, couldn't be checked.
            if grep -q 'semver requires new' "$out"; then
              breaking+=("$crate")
              echo "::warning title=Breaking change::$crate's public API has breaking changes (see the run's summary)"
            else
              errors+=("$crate")
              echo "::warning title=Semver check failed::cargo-semver-checks couldn't check $crate (see the run's summary)"
            fi
          done
          {
            echo "## Semver checks against ${base:0:7}"
            echo
            if [ ${#breaking[@]} -eq 0 ] && [ ${#errors[@]} -eq 0 ]; then
              echo "No breaking changes in the loclib-* crates."
            fi
            if [ ${#breaking[@]} -gt 0 ]; then
              echo "Breaking changes in: ${breaking[*]}"
              echo
            fi
            if [ ${#errors[@]} -gt 0 ]; then
              echo "Couldn't check: ${errors[*]}"
              echo
            fi
            for crate in "${breaking[@]}" "${errors[@]}"; do
              echo "<details><summary><code>$crate</code></summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/$crate.txt"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The coverage summary from the Linux test job on the pull request, in one comment each push
  # updates. A fork's pull request gets a read-only token, so its summary stays in the run's. Not
  # one of passed's needs, so a comment that can't post never holds up a merge.
  report:
    name: Coverage report
    needs: [changes, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # For the local action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Into rust-coverage/. Missing when the Linux job stopped before its summary; then there's
      # nothing to post.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-coverage
      - if: hashFiles('rust-coverage/coverage.md') != ''
        uses: ./.github/actions/pr-comment
        with:
          marker: <!-- locallibrary-ci coverage -->
          section: coverage
          body-path: rust-coverage/coverage.md

  # The check the "Protect Main" ruleset requires: it fails if any job above but semver and report
  # failed or was cancelled, and passes when they all passed or were skipped because nothing they
  # check changed.
  passed:
    name: locallibrary CI passed
    if: always()
    needs: [changes, test, plugins, features, msrv, docs, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
