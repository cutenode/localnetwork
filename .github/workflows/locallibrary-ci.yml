name: locallibrary CI

# Pull requests and pushes to main that touch the Rust workspace run the quick checks. The slow
# suites (Bombadil, every feature combination, mutation testing, fuzzing, the CLI's timings, a
# release build) and a weekly advisory check are in locallibrary-scheduled.yml, and the benchmarks
# in locallibrary-bench.yml. Changes to Markdown alone skip CI, except the crates' READMEs, which are
# their crate docs and doctests (the paths are in the changes job).
on:
  push:
    branches: [main]
  # The default types, and ready_for_review for a draft's first run (see the changes job).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push cancels the run for the push before it. On main, the next run's changes job still
# picks up what the cancelled run didn't finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Actions are pinned to commits (Dependabot keeps them current, see .github/dependabot.yml).
# Every job but msrv builds with the toolchain rust-toolchain.toml pins: `rustup toolchain
# install` with no arguments installs it, with clippy and rustfmt.
jobs:
  # Pushes and pull requests always start this workflow, so the passed job at the end always
  # reports. The other jobs run only when the files listed here change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # The API lists at most 3000 of a pull request's files, so one that size runs everything. A
    # draft skips the work until it's marked ready for review, which leaves the runners to the
    # pull requests about to merge. `draft` says it skipped work there was to do, for passed.
    outputs:
      run: ${{ steps.pr.outputs.draft != 'true' && (github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.rust == 'true' || steps.filter.outputs.readmes == 'true') }}
      draft: ${{ steps.pr.outputs.draft == 'true' && (github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.rust == 'true' || steps.filter.outputs.readmes == 'true') }}
      semver: ${{ github.event_name == 'pull_request' && steps.pr.outputs.draft != 'true' && (github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.semver == 'true') }}
    steps:
      # A pull request's files come from the API. A push is diffed against the last commit this
      # workflow passed on, so what a cancelled or failed run didn't check runs on the next push.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        id: base
        uses: ./.github/actions/last-passed
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - 'apps/locallibrary/**'
              - 'crates/**'
              - 'plugins/**'
              - 'vendor/**'
              - 'packages/tokens/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'lexicons/**'
              - '.github/workflows/locallibrary-*.yml'
              - '!**/*.md'
            readmes:
              - 'crates/*/README.md'
            semver:
              - 'crates/loclib-*/**'
              - 'Cargo.toml'
              - '.github/workflows/locallibrary-ci.yml'
              - '!crates/*/tests/**'
              - '!crates/*/examples/**'
              - '!**/*.md'
      # Whether the pull request is a draft now, from the API. The event has the pull request as it
      # was when the event was made: #211 was marked ready a second after a push, GitHub started a
      # run for the push and none for ready_for_review, and the push's event still said draft. A
      # re-run gets the same event, so only this lets one see that the pull request is ready.
      - if: github.event_name == 'pull_request'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "draft=$(gh api "repos/$GH_REPO/pulls/$NUMBER" --jq .draft)" >> "$GITHUB_OUTPUT"

  # Every OS runs lint, and its tests (locallibrary-ci-os.yml).
  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only main saves its caches, which pull requests restore. A cache saved by each pull request
      # would push main's out of the repo's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The TUI's audio output goes through ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest doesn't run doctests.
      - run: cargo test --doc --workspace --locked

  # Each OS's build, test shards and coverage, in locallibrary-ci-os.yml. A matrix job would wait
  # for every OS's build before any test started, so a macOS runner GitHub never gave #88 skipped
  # the Linux and Windows tests too.
  tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    uses: ./.github/workflows/locallibrary-ci-os.yml
    with:
      os: ${{ matrix.os }}

  # The headless sidecar (no default features: no `account`, `tui` or `playback`) builds and
  # passes clippy without ALSA's headers. locallibrary-scheduled.yml runs its tests and every
  # other combination.
  features:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p locallibrary-cli --no-default-features --locked -- -D warnings

  # The oldest Rust the workspace supports: `rust-version` in Cargo.toml (keep the two in step).
  # Only the library and the CLI, what `cargo install` builds (with their default features): the
  # tests' dev-dependencies may need a newer Rust.
  msrv:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Wins over rust-toolchain.toml in every step, rust-cache's included.
      RUSTUP_TOOLCHAIN: "1.91"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo +1.91 check --workspace --locked

  docs:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The CLI's default `playback` feature builds ALSA's bindings, which need its headers.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo doc --workspace --no-deps --locked

  # RustSec advisories, banned crates and where crates come from (see deny.toml).
  # locallibrary-scheduled.yml also checks advisories weekly, for ones published between pushes.
  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories bans licenses sources

  # Breaking changes to the public API of the loclib-* libraries, against the branch a pull request
  # merges into. None of them is on crates.io yet, so this is a note for maintainers deciding the
  # next version, not a gate: what broke goes to the run's summary and a warning, and the job
  # passes either way. It isn't in `passed`'s needs, so a pull request never waits on it.
  semver:
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The merge commit and its first parent, the base branch the pull request merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: rustup toolchain install
      # No rust-cache: only main saves caches, and this job never runs there. cargo-semver-checks
      # builds each crate, and its baseline, in a target directory of its own anyway.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks
      - name: Check the loclib-* crates against the base branch
        run: |
          base=$(git rev-parse HEAD^1)
          crates=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name | select(startswith("loclib-"))')
          breaking=()
          errors=()
          for crate in $crates; do
            out="$RUNNER_TEMP/$crate.txt"
            if cargo semver-checks --package "$crate" --baseline-rev "$base" --color never > "$out" 2>&1; then
              continue
            fi
            cat "$out"
            # Breaking changes end the output with "Summary semver requires new major version" (or
            # minor). Anything else, such as a crate the base doesn't have yet, couldn't be checked.
            if grep -q 'semver requires new' "$out"; then
              breaking+=("$crate")
              echo "::warning title=Breaking change::$crate's public API has breaking changes (see the run's summary)"
            else
              errors+=("$crate")
              echo "::warning title=Semver check failed::cargo-semver-checks couldn't check $crate (see the run's summary)"
            fi
          done
          {
            echo "## Semver checks against ${base:0:7}"
            echo
            if [ ${#breaking[@]} -eq 0 ] && [ ${#errors[@]} -eq 0 ]; then
              echo "No breaking changes in the loclib-* crates."
            fi
            if [ ${#breaking[@]} -gt 0 ]; then
              echo "Breaking changes in: ${breaking[*]}"
              echo
            fi
            if [ ${#errors[@]} -gt 0 ]; then
              echo "Couldn't check: ${errors[*]}"
              echo
            fi
            for crate in "${breaking[@]}" "${errors[@]}"; do
              echo "<details><summary><code>$crate</code></summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/$crate.txt"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The coverage summary from the Linux coverage job on the pull request, in one comment each push
  # updates. A fork's pull request gets a read-only token, so its summary stays in the run's. Not
  # one of passed's needs, so a comment that can't post never holds up a merge.
  report:
    name: Coverage report
    needs: [changes, tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # For the local action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Into rust-coverage/, by name: a pattern that matches one artifact unpacks it where the
      # workflow runs. Missing when the Linux coverage job stopped before its summary; then there's
      # nothing to post.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: rust-coverage
          path: rust-coverage
      - if: hashFiles('rust-coverage/coverage.md') != ''
        uses: ./.github/actions/pr-comment
        with:
          marker: <!-- locallibrary-ci coverage -->
          section: coverage
          body-path: rust-coverage/coverage.md

  # The check the "Protect Main" ruleset requires: it fails if any job above but semver and report
  # failed or was cancelled, and passes when they all passed or were skipped because nothing they
  # check changed. A job skipped when changes found something to check didn't run because one it
  # needs didn't finish: #88's macOS build was cancelled for want of a runner, which skipped test,
  # coverage and hegel, and this still passed.
  passed:
    name: locallibrary CI passed
    if: always()
    needs: [changes, lint, tests, features, msrv, docs, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
      # A draft's skipped jobs would pass too, and this check would stay green if marking it ready
      # started no run, as with #211, which merged without its tests running.
      - if: needs.changes.outputs.draft == 'true'
        run: |
          echo "::error title=Draft::Nothing ran because the pull request was a draft. Marking it ready for review starts a new run; if none started, re-run this one."
          exit 1
