name: Dependency review

# The dependencies a pull request adds or updates, in the lockfiles, manifests and workflows, from
# GitHub's dependency graph. cargo-deny (deny.toml) already checks the Rust crates' licences
# and advisories, and npm-advisories.yml the npm packages' advisories. What's left is mostly the
# licences of npm packages and of the actions the workflows use, and advisories for those actions.
#
# Its own workflow, since it covers all three ecosystems and only means anything on a pull request.
# It isn't a required check, so it can filter on paths in its trigger: a pull request that changes
# none of the files the dependency graph reads starts no runner. Those are the lockfiles and
# manifests (pnpm-lock.yaml, package-lock.json and package.json, Cargo.lock and Cargo.toml) and the
# workflows, which only count as manifests in .github/workflows/, so the composite actions in
# .github/actions/ aren't among them. pnpm-workspace.yaml isn't one either: what its overrides
# change shows up in pnpm-lock.yaml.
on:
  # Not `reopened`: a reopened pull request has the same changes it was reviewed on.
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/package.json"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    # A draft waits until it's ready for review, as ci.yml's jobs do. Nothing requires this check,
    # so the event's draft state is enough: ready_for_review starts the run that reviews it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The summary comment, posted only when the review fails. Pull requests from forks get a
      # read-only token, and the action logs a warning in place of the comment.
      pull-requests: write
    steps:
      # Reads the base and head commits through the API: nothing to check out.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Like `pnpm audit --prod` in npm-advisories.yml: an advisory of any severity fails, in
          # what ships (the runtime scope) and not the dev tooling.
          fail-on-severity: low
          fail-on-scopes: runtime
          # The same list as [licenses] allow in deny.toml, so both ecosystems follow one policy.
          # Keep the two in step. OFL-1.1 is added for the website's fonts (@fontsource-variable),
          # which no Rust crate ships, and MITNFA for bowser, which the bug reports read the
          # browser with: MIT, plus a clause that a changed copy can't claim its authors made it.
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause,
            BSD-3-Clause,
            BSL-1.0,
            CC0-1.0,
            CDLA-Permissive-2.0,
            ISC,
            MIT,
            MIT-0,
            MPL-2.0,
            Unicode-3.0,
            Unlicense,
            Zlib,
            OFL-1.1,
            MITNFA
          # rust-cache is LGPL-3.0. It runs in CI and nothing it contains ships with the tools.
          # sharp's prebuilt libvips (@img/sharp-libvips-*, and bundled in the win32 and wasm32
          # builds) is LGPL-3.0-or-later. sharp loads it as an unmodified shared library, and the
          # website only runs it on its own server to draw link preview cards, so nothing LGPL is
          # changed or handed to anyone. sharp itself is Apache-2.0.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache,
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-win32-arm64,
            pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64,
            pkg:npm/@img/sharp-wasm32
          comment-summary-in-pr: on-failure
