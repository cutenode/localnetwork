name: Release budgets
description: >-
  Builds the release CLI on Linux and measures what benchmarks/budgets/ holds its release job to
  (see benchmarks/README.md) with tools/budgets/measure-release.sh. Writes them to `out`, for
  tools/budgets/cli.ts check and an upload.

inputs:
  root:
    description: The checkout to measure, which a job measures its base commit in when no run did.
    default: .
  out:
    description: The absolute path of the directory to write each area's measurements to.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-packages
      with:
        packages: libasound2-dev valgrind
    # This commit's script, also for a base measured in a checkout of its own.
    - shell: bash
      working-directory: ${{ inputs.root }}
      env:
        OUT: ${{ inputs.out }}
      run: '"$GITHUB_WORKSPACE/tools/budgets/measure-release.sh" "$OUT"'
