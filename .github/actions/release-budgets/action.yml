name: Release budgets
description: >-
  Builds the release CLI on Linux and measures what benchmarks/budgets/ holds its release job to
  (see benchmarks/README.md): the size of its binary and archive, the instructions everyday commands
  and a frame of the player run under cachegrind, which counts them exactly, on the 3,886-track
  fixture, and the names of the packages it links. Writes them to `out`, for tools/budgets/cli.ts
  check and an upload.

inputs:
  root:
    description: The checkout to measure, which a job measures its base commit in when no run did.
    default: .
  out:
    description: The absolute path of the directory to write each area's measurements to.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/apt-packages
      with:
        packages: libasound2-dev valgrind
    # By name, whatever the version, so a new crate shows and a version bump doesn't. Without
    # colour: CARGO_TERM_COLOR colours each repeat's `(*)`, which sed then doesn't take off.
    - shell: bash
      working-directory: ${{ inputs.root }}
      env:
        OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$OUT"
        cargo tree --color never --locked --target x86_64-unknown-linux-gnu -e normal,no-proc-macro -p locallibrary-cli --prefix none |
          sed 's/ .*//' | sort -u | jq -R -s '{"locallibrary-cli": split("\n")[:-1]}' > "$OUT/deps.json"
    - shell: bash
      working-directory: ${{ inputs.root }}
      run: cargo build --profile dist -p locallibrary-cli --locked
    # CARGO_TARGET_DIR: a base measured in its own checkout builds into the job's target, which the
    # cache restored.
    - shell: bash
      working-directory: ${{ inputs.root }}
      env:
        OUT: ${{ inputs.out }}
      run: |
        dist=${CARGO_TARGET_DIR:-target}/dist
        tar -C "$dist" -cJf "$OUT/archive.tar.xz" locallibrary
        jq -n --argjson binary "$(wc -c < "$dist/locallibrary")" \
          --argjson archive "$(wc -c < "$OUT/archive.tar.xz")" \
          '{"locallibrary": $binary, "archive": $archive}' > "$OUT/size-x86_64-unknown-linux-gnu.json"
        rm "$OUT/archive.tar.xz"
    - shell: bash
      working-directory: ${{ inputs.root }}
      env:
        OUT: ${{ inputs.out }}
      run: |
        export LOCALLIBRARY_VOLUMES="$RUNNER_TEMP/volumes" LOCALLIBRARY_STORE="$RUNNER_TEMP/store" HOME="$RUNNER_TEMP/home"
        for drive in LARGE LARGE2; do
          mkdir -p "$LOCALLIBRARY_VOLUMES/$drive/PIONEER/rekordbox"
          cp crates/locallibrary/tests/fixtures/rekordcrate/large/export.pdb "$LOCALLIBRARY_VOLUMES/$drive/PIONEER/rekordbox/"
        done
        mkdir -p "$HOME"
        instructions() {
          valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null "${CARGO_TARGET_DIR:-target}/dist/locallibrary" "$@" 2>&1 >/dev/null |
            sed -n 's/.*I *refs: *//p' | tr -d ,
        }
        {
          echo "version $(instructions --version)"
          echo "drive_ls $(instructions drive ls)"
          echo "tracks_filter $(instructions tracks LARGE --filter 'bpm:120-130 -genre:techno')"
          echo "tracks_search $(instructions tracks LARGE --search house)"
          echo "tracks_sort $(instructions tracks LARGE --sort artist,title)"
          echo "diff $(instructions diff LARGE LARGE2)"
          echo "check $(instructions check LARGE LARGE2)"
          echo "doctor $(instructions doctor LARGE)"
        } | jq -Rn '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add' > "$OUT/cli.json"
    # A frame of the player: the frame test's instructions over many frames, less a run of none,
    # which leaves out reading the fixture. It's the release profile, as dist's test binary would
    # take a second fat LTO link.
    - shell: bash
      working-directory: ${{ inputs.root }}
      env:
        OUT: ${{ inputs.out }}
      run: |
        unit=$(cargo test --release -p locallibrary-cli --test unit --locked --no-run --message-format=json-render-diagnostics |
          jq -r 'select(.executable != null and .target.name == "unit") | .executable')
        "$GITHUB_WORKSPACE/tools/budgets/frame-instructions.sh" "$unit" 600 tui-instructions "$OUT"
