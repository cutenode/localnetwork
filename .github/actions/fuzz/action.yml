name: Fuzz
description: >-
  Runs cargo-fuzz targets through their fuzz-<target> aliases (.cargo/config.toml) for the same time,
  as many at once as the runner has CPUs, from whatever corpus is in fuzz/corpus/ (see
  .github/actions/fuzz-artifact). Fails when a target crashed, with its input in
  fuzz/artifacts/<target>/.

inputs:
  targets:
    description: The targets to run, separated by spaces (tools/fuzz/cli.ts select), or `all` for every one `cargo fuzz list` names.
    required: true
  seconds:
    description: How long each target runs.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/fuzz-setup
    # Built up front, so the runs don't queue on cargo's lock to build the same thing: every target
    # in one build, or each chosen one. Each target's log is printed whole once they've all finished.
    - shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        SECONDS_EACH: ${{ inputs.seconds }}
      run: |
        if [ "$TARGETS" = all ]; then
          cargo +nightly fuzz build
          TARGETS=$(cargo fuzz list)
          mapfile -t targets <<< "$TARGETS"
        else
          read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do cargo +nightly fuzz build "$target"; done
        fi
        logs=$RUNNER_TEMP/fuzz-logs
        mkdir -p "$logs"
        status=0
        printf '%s\n' "${targets[@]}" | xargs -P "$(nproc)" -I{} bash -c '
          cargo +nightly "fuzz-$1" -max_total_time="$SECONDS_EACH" -timeout=10 -rss_limit_mb=2048 >"$2/$1.log" 2>&1 ||
            { echo "::error::fuzz target $1 crashed: its input is in fuzz/artifacts/$1/"; exit 1; }
        ' _ {} "$logs" || status=1
        for log in "$logs"/*.log; do
          echo "::group::$(basename "$log" .log)"
          cat "$log"
          echo "::endgroup::"
        done
        exit "$status"
