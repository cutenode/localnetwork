# Which labels a pull request gets from the files it changes (see .github/workflows/pr-labels.yml).
web:
  - changed-files:
      - any-glob-to-any-file: ["apps/web/**", "packages/tokens/**", "flags/**"]

locallibrary:
  - changed-files:
      - any-glob-to-any-file:
          [
            "apps/locallibrary/**",
            "crates/**",
            "plugins/**",
            "vendor/**",
            "fuzz/**",
            "benchmarks/**",
            "tools/budgets/**",
            "Cargo.toml",
            "Cargo.lock",
          ]

localtoolbox:
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/**"]

lexicons:
  - changed-files:
      - any-glob-to-any-file: ["lexicons/**"]

atstore:
  - changed-files:
      - any-glob-to-any-file: ["packages/atstore/**"]

# The area inside a tool. A file can be in more than one (a feature's command is also part of the
