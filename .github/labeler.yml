      - all-globs-to-any-file: ["apps/locallibrary/{src,tests}/**", "!apps/locallibrary/src/{tui,rpc}{.rs,/**}"]
      - any-glob-to-any-file: ["apps/locallibrary/{build.rs,docs/commands.md}"]

"locallibrary: player":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/locallibrary/src/tui/**"
          - "apps/locallibrary/docs/player.md"
          - "apps/locallibrary/bombadil/**"
          - "crates/loclib-waveform/**"

"locallibrary: sidecar":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/locallibrary/src/rpc{.rs,/**}"
          - "apps/locallibrary/docs/{sidecar.md,rpc/**}"
          - "crates/locallibrary/src/api{.rs,/**}"

"locallibrary: core":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/{locallibrary,loclib-model,loclib-progress,loclib-mysettings,loclib-equipment}/**"
          - "vendor/**"
          - "fuzz/**"

"locallibrary: analysis":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/loclib-analysis/**"
          - "plugins/sound/**"
          - "crates/locallibrary/src/sound{.rs,/**}"
          - "apps/locallibrary/src/analysis_cmd.rs"
          - "apps/locallibrary/src/tui/analyzer{.rs,/**}"

"locallibrary: mixes":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/loclib-mixid/**"
          - "crates/locallibrary/src/mix/**"
          - "apps/locallibrary/src/mix_cmd{.rs,/**}"
          - "apps/locallibrary/src/tui/mix{.rs,/**}"

"locallibrary: tracklists":
  - changed-files:
      - any-glob-to-any-file:
          ["crates/loclib-tracklist/**", "plugins/tracklist/**", "fuzz/fuzz_targets/tracklist.rs"]

"locallibrary: interop":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/loclib-interop/**"
          - "plugins/interop/**"
          - "crates/locallibrary/src/interop{.rs,/**}"
          - "apps/locallibrary/docs/other-software.md"

"locallibrary: transcode":
  - changed-files:
      - any-glob-to-any-file: ["crates/loclib-transcode/**"]

"locallibrary: plugins":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/loclib-plugin/**"
          - "plugins/**"
          - "{apps,crates}/locallibrary/**/plugin{,s,_cmd}{.rs,.md,/**}"
          - "crates/locallibrary/examples/test-plugin/**"

"locallibrary: publishing":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/locallibrary/src/{atmosphere,publish,sets,profile}{.rs,/**}"
          - "apps/locallibrary/src/{account_cmd,publish_cmd,sets_cmd,profile_cmd}{.rs,/**}"
          - "apps/locallibrary/src/tui/{account,account_off,profile}{.rs,/**}"
          - "apps/locallibrary/docs/{account,sets}.md"
          - "lexicons/computer/localnetwork/{dj,locallibrary}/**"
          - "lexicons/computer/localnetwork/locallibraryPublishing.json"

"localtoolbox: core":
  - changed-files:
      - all-globs-to-any-file: ["apps/localtoolbox/src/**", "!apps/localtoolbox/src/tools/**"]
      - any-glob-to-any-file:
          - "apps/localtoolbox/state-transfer.ts"
          - "apps/localtoolbox/{docs,scripts,icons,test/lib}/**"

"localtoolbox: content script":
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/content.{ts,css}", "apps/localtoolbox/test/content/**"]

"localtoolbox: playlist to text":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/localtoolbox/src/tools/soundcloud-playlist-to-text/**"
          - "apps/localtoolbox/test/**/playlist-to-text.*"

"localtoolbox: manager":
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/src/tools/manager/**", "apps/localtoolbox/test/**/manager.*"]

"localtoolbox: artists":
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/src/tools/artists/**", "apps/localtoolbox/test/**/artists.*"]

"localtoolbox: downloads":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/localtoolbox/src/tools/third-party-downloads/**"
          - "apps/localtoolbox/src/lib/{downloaded,downloader}.*"
          - "apps/localtoolbox/downloaded-store.ts"
          - "apps/localtoolbox/test/**/{third-party-downloads,downloaded,downloaded-store}.*"

# Across the tools.

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.{md,mdx}", "apps/*/docs/**", "LICENSE"]

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/{test,tests,__snapshots__}/**"
          - "**/tests.rs"
          - "**/*.{test,e2e}.ts"
          - "**/{vitest,vitest.stryker,playwright}.config.ts"
          - "**/stryker*.{mjs,ts}"
          - "apps/web/src/lib/server/testing/**"
          - "apps/locallibrary/bombadil/**"
          - "fuzz/**"
          - ".config/nextest.toml"
          - ".cargo/mutants.toml"

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["pnpm-lock.yaml", "Cargo.lock", "**/package-lock.json"]

github_actions:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/actionlint.yaml"]

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/*"
          - ".github/rulesets/**"
          - ".github/ISSUE_TEMPLATE/**"
          - "{.cargo,.config,tools,patches}/**"
          - "{package.json,pnpm-workspace.yaml,lefthook.yml,.node-version}"
          - "{rust-toolchain,rustfmt,clippy,deny,dist-workspace}.toml"
          - "{.oxlintrc.json,.oxfmtrc.json,.editorconfig,.gitattributes,.gitignore,.dockerignore}"
          - "apps/*/{package.json,tsconfig*.json,*.config.{ts,cjs},components.json,lighthouserc.cjs}"
          - "apps/*/{.oxlintrc.json,knip.json,.vscode/**}"
