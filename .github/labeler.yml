# Which tool's label a pull request gets from the files it changes (see .github/workflows/pr-labels.yml).
web:
  - changed-files:
      - any-glob-to-any-file: ["apps/web/**", "packages/tokens/**"]

locallibrary:
  - changed-files:
      - any-glob-to-any-file:
          ["apps/locallibrary/**", "crates/**", "vendor/**", "fuzz/**", "Cargo.toml", "Cargo.lock"]

localtoolbox:
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/**"]

lexicons:
  - changed-files:
      - any-glob-to-any-file: ["lexicons/**"]
