# Across the tools. tests and documentation only when every file a pull request changes is one.

documentation:
  - changed-files:
      - any-glob-to-all-files: ["**/*.{md,mdx}", "apps/*/docs/**", "LICENSE"]

tests:
  - changed-files:
      - any-glob-to-all-files:
          - "**/{test,tests,__snapshots__}/**"
          - "**/tests.rs"
          - "**/*.{test,e2e}.ts"
          - "**/{vitest,vitest.stryker,playwright}.config.ts"
          - "**/stryker*.{mjs,ts}"
          - "apps/web/src/lib/server/testing/**"
          - "apps/web/{lighthouse/**,scripts/lighthouse*.ts,scripts/lib/lighthouse.ts}"
          - "apps/locallibrary/bombadil/**"
          - "fuzz/**"
          - ".config/nextest.toml"
          - ".cargo/mutants.toml"

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["pnpm-lock.yaml", "Cargo.lock", "**/package-lock.json"]

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - ".github/{actionlint.yaml,zizmor.yml,build-setup.yml}"
          - ".github/{codeql,rulesets}/**"
          - "tools/ruleset.sh"

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/{SECURITY.md,zizmor.yml}"
          - ".github/codeql/**"
          - ".github/workflows/{codeql,scorecard,dependency-review,npm-advisories}.yml"
          - "{deny,osv-scanner}.toml"
          - "fuzz/osv-scanner.toml"

performance:
  - changed-files:
      - any-glob-to-any-file:
          - "benchmarks/**"
          - "crates/*/benches/**"
          - "tools/budgets/**"
          - ".github/actions/{release-budgets,size-report}/**"
          - ".github/workflows/locallibrary-bench.yml"
          - "apps/web/{lighthouse/**,lighthouserc.cjs}"

accessibility:
  - changed-files:
      - any-glob-to-any-file: ["**/a11y*.{ts,mjs}"]

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/*"
          - ".github/ISSUE_TEMPLATE/**"
          - "{.cargo,.config,.railway,.regal,tools,patches}/**"
          - "{package.json,pnpm-workspace.yaml,.npmrc,lefthook.yml,sgconfig.yml,knip.jsonc,.node-version}"
          - "{rust-toolchain,rustfmt,clippy,deny,about,dist-workspace,osv-scanner}.toml"
          - "about.hbs"
          - "{.oxlintrc.json,.oxfmtrc.json,tsconfig.json,commitlint.config.js,_typos.toml,taplo.toml,.lycheeignore,.editorconfig,.gitattributes,.gitignore,.dockerignore}"
          - "apps/*/{package.json,tsconfig*.json,*.config.{ts,cjs},components.json,lighthouserc.cjs}"
          - "apps/*/.oxlintrc.json"
