# Which labels a pull request gets from the files it changes (see .github/workflows/pr-labels.yml).
web:
  - changed-files:
      - any-glob-to-any-file: ["apps/web/**", "packages/tokens/**"]

locallibrary:
  - changed-files:
      - any-glob-to-any-file:
          ["apps/locallibrary/**", "crates/**", "plugins/**", "vendor/**", "fuzz/**", "Cargo.toml", "Cargo.lock"]

localtoolbox:
  - changed-files:
      - any-glob-to-any-file: ["apps/localtoolbox/**"]

lexicons:
  - changed-files:
      - any-glob-to-any-file: ["lexicons/**"]

# The area inside a tool. A file can be in more than one (a feature's command is also part of the
# cli), and lexicons go with the feature that reads or writes them.

"web: directory":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/+page.*"
          - "apps/web/src/routes/projects/+page.*"
          - "apps/web/src/routes/match/**"
          - "apps/web/src/routes/api/places/**"
          - "apps/web/src/lib/{matching,places,geo}.*"
          - "apps/web/src/lib/taxonomy/**"
          - "apps/web/src/lib/server/geocode.*"
          - "apps/web/src/lib/server/happyview/directory.*"
          - "apps/web/src/lib/components/{GenreInput,NearInput,PlacePicker,ScoreBar}.svelte"
          - "apps/web/lua/**"
          - "lexicons/computer/localnetwork/directory/**"

"web: projects":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/projects/*/**"
          - "apps/web/src/lib/{dj,dj-schema}.*"
          - "apps/web/src/lib/server/services/{projects,dj,sets}.*"
          - "apps/web/src/lib/server/project-page.*"
          - "apps/web/src/lib/server/forms/{claim,project}.*"
          - "apps/web/src/lib/components/{Project*,ClaimFields,DjSets,DjStats,LinkedSet}.svelte"
          - "apps/web/src/lib/components/profile.svelte.test.ts"
          - "lexicons/computer/localnetwork/project{.json,/**}"
          - "lexicons/computer/localnetwork/dj/**"

"web: mixes":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/mixes/**"
          - "apps/web/src/routes/projects/*/mixes/**"
          - "apps/web/src/lib/mix/**"
          - "apps/web/src/lib/components/mix/**"
          - "apps/web/src/lib/components/MixList.svelte"
          - "apps/web/src/lib/server/services/tracklists.*"
          - "apps/web/scripts/mix-fixture.ts"

"web: epk":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/epk/**"
          - "apps/web/src/routes/projects/*/epk/**"
          - "apps/web/src/lib/{epk,epk-schema}.*"
          - "apps/web/src/lib/components/epk/**"
          - "apps/web/src/lib/server/{epk-page,services/epk,forms/epk}.*"
          - "lexicons/computer/localnetwork/epk{.json,/**}"

"web: bookings":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/bookings/**"
          - "apps/web/src/lib/server/services/bookings.*"
          - "apps/web/src/lib/components/BookingDetails.svelte"
          - "lexicons/computer/localnetwork/booking/**"

"web: planner":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/planner/**"
          - "apps/web/src/lib/server/services/planner.*"
          - "lexicons/computer/localnetwork/planner/**"

"web: staff":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/admin/**"
          - "apps/web/src/routes/me/requests/**"
          - "apps/web/src/lib/server/services/{staff,project-admin,requests,diff}.*"
          - "apps/web/src/lib/server/audit/**"
          - "apps/web/src/lib/components/DiffTable.svelte"
          - "lexicons/computer/localnetwork/{audit,moderation,staff}/**"

"web: accounts":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/routes/{login,logout,oauth,me,oauth-client-metadata.json}/**"
          - "apps/web/src/lib/server/auth/**"
          - "apps/web/src/lib/server/atproto/oauth.*"
          - "apps/web/src/lib/server/services/accounts.*"
          - "lexicons/computer/localnetwork/permissions.json"

"web: tools":
  - changed-files:
      - any-glob-to-any-file:
          ["apps/web/src/routes/tools/**", "apps/web/src/lib/tools/**", "apps/web/src/lib/server/tools/**"]

"web: server":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/hooks.server.ts"
          - "apps/web/src/lib/server/{atproto,db,happyview,sync,testing}/**"
          - "apps/web/src/lib/server/{app,bootstrap,compress,config,core,http,logger,rate-limit}.*"
          - "apps/web/src/routes/{xrpc,.well-known,media,healthz}/**"
          - "apps/web/lua/**"
          - "apps/web/scripts/**"
          - "apps/web/{Dockerfile,.env.example}"
          - "lexicons/computer/localnetwork/space/**"

"web: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/src/lib/{ui,components,assets}/**"
          - "apps/web/src/routes/{+layout.svelte,+error.svelte,layout.css}"
          - "apps/web/src/routes/{about,for-djs,privacy}/**"
          - "apps/web/src/{app.html,lib/format.ts,lib/format.test.ts,lib/hotkeys.svelte.ts}"
          - "apps/web/{.storybook,static}/**"
          - "packages/tokens/**"

"locallibrary: cli":
