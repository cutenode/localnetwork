name: Local Network bug
description: Something the Local Network website got wrong
labels: ["bug", "web"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you were doing, on which page, and what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /match
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 26, iPhone
