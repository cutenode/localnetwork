name: Feature request
description: Something you'd like locallibrary to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way. The set, drive setup or habit you hit it with helps.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: What locallibrary could do about it. The command you'd want to type is a good way to show it.

  - type: textarea
    id: workarounds
    attributes:
      label: How you get by now
      description: Workarounds in locallibrary, rekordbox or other software, if any.
