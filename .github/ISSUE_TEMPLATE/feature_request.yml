name: Feature request
description: Something you'd like Local Network, locallibrary or localtoolbox to do
labels: ["enhancement"]
type: Feature
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Local Network (the website)
        - locallibrary
        - localtoolbox
        - More than one, or something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way. The set, drive setup or habit you hit it with helps.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: What it could do about it. For locallibrary, the command you'd want to type is a good way to show it.

  - type: textarea
    id: workarounds
    attributes:
      label: How you get by now
      description: Workarounds in our tools, rekordbox or other software, if any.
