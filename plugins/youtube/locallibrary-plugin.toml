id = "youtube"
name = "YouTube"
version = "0.1.0"
protocol = "^0.2"
# It sends the set's video, title and tracklist to YouTube's upload API, and nowhere else.
capabilities = ["net:www.googleapis.com"]

# `sets publish SET --to youtube:video`: the recording becomes a video on the signed-in account's
# channel, a still picture over the audio, its tracklist the description's chapters, and the
# video's page the set's link.
[[contributes.destinations]]
name = "video"
title = "A video on YouTube"
kind = "set"

# Uploading is all it asks a Google account for.
[[accounts]]
type = "google"
scopes = ["youtube-upload"]
why = "It uploads each set you publish to YouTube as a video on your channel."

[[contributes.settings]]
key = "privacy"
title = "Who can watch a set's video"
type = "enum"
choices = ["private", "unlisted", "public"]
default = "unlisted"

[[contributes.settings]]
key = "picture"
title = "Picture shown in a set's video (else a black frame)"
type = "file"
