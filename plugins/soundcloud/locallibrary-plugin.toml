id = "soundcloud"
name = "SoundCloud"
version = "0.1.0"
protocol = "^0.2"
# It sends the set's recording, title and tracklist to SoundCloud's API, and nowhere else.
capabilities = ["net:api.soundcloud.com"]

# `sets publish SET --to soundcloud:track`: the recording becomes a track of the signed-in
# account's, its tracklist the description, and the track's page the set's link.
[[contributes.destinations]]
name = "track"
title = "A track on SoundCloud"
kind = "set"

# SoundCloud wants a client secret when a code is traded for tokens and when they're refreshed,
# so both go through Local Network's token exchange, which holds it. SoundCloud has no scopes to
# ask for, takes the token as `Authorization: OAuth <token>`, and sends the browser back only to
# the redirect URI its app was registered with, port and all: http://127.0.0.1:47110/callback.
[[contributes.accounts]]
id = "soundcloud"
title = "SoundCloud"
authorize_url = "https://secure.soundcloud.com/authorize"
token_exchange = "https://localnetwork.computer/api/token-exchange/soundcloud"
# PLACEHOLDER: Local Network's SoundCloud app isn't registered yet. Once it is, this is its client
# id (public), the same as the website's SOUNDCLOUD_CLIENT_ID, which the token exchange sends with
# it.
client_id = "PLACEHOLDER-unregistered-soundcloud-client-id"
token = { scheme = "OAuth" }
redirect_port = 47110

[[contributes.settings]]
key = "sharing"
title = "Who can listen to a set's track"
type = "enum"
choices = ["private", "public"]
default = "private"

[[contributes.settings]]
key = "genre"
title = "Genre of a set's track (else none)"
type = "string"

[[contributes.settings]]
key = "picture"
title = "Artwork for a set's track (JPEG or PNG, else SoundCloud's)"
type = "file"
