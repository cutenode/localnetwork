#:schema ../../crates/loclib-plugin/manifest.schema.json
id = "archive"
name = "Internet Archive"
version = "0.1.0"
protocol = "^0.2"
# It checks whether an identifier is free on archive.org, and sends the set's recording, title and
# tracklist to the Archive's S3 API, and nowhere else.
capabilities = ["net:archive.org", "net:s3.us.archive.org"]

# `sets publish SET --to archive:item`: the recording becomes an item in Community Audio of the
# account the keys are for, its tracklist the description, and the item's page the set's link.
[[contributes.destinations]]
name = "item"
title = "An item on the Internet Archive"
kind = "set"

# The Archive's S3 API takes an account's pair of S3 keys in the Authorization header. The host
# keeps them and fills them into the upload, which names the account; the plugin never sees them.
[[accounts]]
type = "archive"
scopes = ["upload"]
why = "It uploads each set you publish to the Internet Archive as an item on your account."

# Who the item is by, and what its identifier starts with.
[[contributes.settings]]
key = "creator"
title = "Your DJ name, as the item's creator"
type = "string"
