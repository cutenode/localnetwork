[workspace]
resolver = "3"
members = ["apps/locallibrary", "crates/locallibrary", "crates/loclib-analysis", "crates/loclib-equipment", "crates/loclib-interop", "crates/loclib-mixid", "crates/loclib-model", "crates/loclib-mysettings", "crates/loclib-plugin", "crates/loclib-progress", "crates/loclib-tracklist", "crates/loclib-transcode", "crates/loclib-waveform", "plugins/analysis", "plugins/coverart", "plugins/interop", "plugins/tracklist", "vendor/rekordbox-pdb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/cutenode/localnetwork"

[workspace.dependencies]
# Without its default features (the Atmosphere account): the CLI turns them on with its own.
locallibrary = { path = "crates/locallibrary", default-features = false }
loclib-analysis = { path = "crates/loclib-analysis", version = "0.1.0" }
loclib-equipment = { path = "crates/loclib-equipment", version = "0.1.0" }
loclib-interop = { path = "crates/loclib-interop", version = "0.1.0" }
loclib-mixid = { path = "crates/loclib-mixid", version = "0.1.0" }
loclib-model = { path = "crates/loclib-model", version = "0.1.0" }
loclib-mysettings = { path = "crates/loclib-mysettings", version = "0.1.0" }
loclib-plugin = { path = "crates/loclib-plugin", version = "0.1.0" }
loclib-progress = { path = "crates/loclib-progress", version = "0.1.0" }
loclib-transcode = { path = "crates/loclib-transcode", version = "0.1.0" }
loclib-tracklist = { path = "crates/loclib-tracklist", version = "0.1.0" }
loclib-waveform = { path = "crates/loclib-waveform", version = "0.1.0" }
rekordbox-pdb = { path = "vendor/rekordbox-pdb" }
rekordcrate = { version = "0.3", default-features = false }
aes = "0.8"
anyhow = "1"
# Base64 for data URIs, packed waveforms, PowerShell's -EncodedCommand and Serato's cue tag.
base64 = "0.22"
blake3 = "1.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
# Shell completion (`locallibrary completions`), dynamic: the shell asks the binary, which lists
# mounted drives, playlists, My Tags and history lists.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
# Man pages (`locallibrary man`).
clap_mangen = "0.3"
console = "0.16"
directories = "6"
filetime = "0.2"
fs4 = "1"
getrandom = "0.3"
hmac = "0.12"
# Atmosphere account sign-in (AT Protocol OAuth). Pinned: the jacquard crates make breaking
# changes between minor versions.
jacquard-api = { version = "=0.12.2", default-features = false, features = ["com_atproto", "std"] }
jacquard-common = "=0.12.2"
jacquard-identity = { version = "=0.12.2", features = ["dns"] }
jacquard-oauth = "=0.12.2"
keyring = "4.2"
# The types jacquard's HTTP client trait is written in (reqwest is built on them).
http = "1"
# TLS comes with jacquard (rustls and Mozilla's roots, built in); the system's own trust store is
# added for computers whose networks need a root installed there (a company or venue proxy).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
# The ordered map, in place of BTreeMap (clippy.toml bans it): keeps insertion order, so code that
# needs keys sorted sorts them where it does.
indexmap = { version = "2.14", features = ["serde"] }
indicatif = "0.18"
lofty = "0.25"
percent-encoding = "2.3"
rusqlite = { version = "0.40", features = ["bundled"] }
# Which volume and folder a path is (device and inode, or volume serial and file index): a drive
# without an identity is told apart from another mounted at the same path by it.
same-file = "1"
rustfft = "6.4"
# FxHash for the HashMaps and HashSets: faster than std's SipHash on the integer ids and short
# strings they're keyed by, and nothing hashed comes from an untrusted network peer.
rustc-hash = "2.1"
# JSON Schema for the API's requests and results: the RPC sidecar's machine-readable contract.
schemars = { version = "1.2", default-features = false, features = ["derive", "std", "chrono04", "indexmap2", "uuid1"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: an f64 written to the store (a report's coverage, a set's BPM) reads back as
# the same f64, not one bit off. (Test builds get it from jsonschema anyway; this is for the rest.)
# `preserve_order`: JSON objects keep their order (a plugin's params and an analyzer's fields, the
# sidecar's answers). Here, so every build of every crate writes JSON in one order.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# Where in a request a bad parameter is (`edits[0].op`), for invalid_params errors (loclib-plugin's,
# which the RPC sidecar shares).
serde_path_to_error = "0.1"
sha2 = "0.10"
# Edit distance, for "did you mean" on a mistyped filter field or subcommand.
strsim = "0.11"
# Decoding for mix identification: what drives and recorders hold (MP3, AAC/ALAC, FLAC, WAV, AIFF).
symphonia = { version = "0.5", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
# Property-based tests (dev only). Pinned: Hegel is in beta and makes breaking changes.
# `static-engine` links Hegel's engine as an ordinary dependency, so it's in Cargo.lock: without
# it, hegeltest's build script fetches and builds the engine in a nested, unlocked cargo build.
hegeltest = { version = "=0.48.1", features = ["static-engine"] }
# JSON Schema validation: the property tests check the RPC contract and the API's schemas with it,
# and loclib-plugin checks that a plugin manifest's params and options schemas compile.
# Without its default features: no fetching schemas over HTTP or from files.
jsonschema = { version = "0.58.6", default-features = false }

# OneLibrary's key derivation (PBKDF2-HMAC-SHA512, 256,000 rounds) takes seconds unoptimised.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# What dist builds release archives with (dist-workspace.toml).
[profile.dist]
inherits = "release"
